    Device:
      type: object
      properties:
        serial_number:
          type: string
        location_name:
          type: string
          description: Empty string when not set.
        is_active:
          type: boolean
        last_sync:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$
          description: |
            When the device last reached the server, `YYYY-MM-DD HH:MM:SS` in Asia/Baghdad.
            The field is omitted (not null) until the device first connects.
      required:
        - serial_number
        - location_name
        - is_active
      example:
        serial_number: TEST-SN-0001
        location_name: Main Gate
        is_active: true
        last_sync: '2026-09-21 07:00:00'
    DeviceCreateRequest:
      type: object
      properties:
        serial_number:
          type: string
          minLength: 1
          maxLength: 50
          description: Required (400). An existing serial number returns 409. Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        location_name:
          type: string
          maxLength: 50
          default: ''
          description: Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        is_active:
          type: boolean
          default: true
          description: Omitted means true (active).
      required:
        - serial_number
      example:
        serial_number: TEST-SN-0001
        location_name: Main Gate
        is_active: true
    DeviceUpdateRequest:
      type: object
      description: |
        Changes only the fields it carries: an omitted `location_name` or `is_active` keeps its
        stored value. At least one of them is required (400 otherwise). A present empty
        `location_name` clears the location.
      properties:
        serial_number:
          type: string
          minLength: 1
          maxLength: 50
          description: Required (400). A serial number with no device returns 404.
        location_name:
          type: string
          maxLength: 50
          description: Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        is_active:
          type: boolean
      required:
        - serial_number
      example:
        serial_number: TEST-SN-0001
        location_name: Side Gate
        is_active: true
    DeviceListResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Device'
      required:
        - status
        - data
      example:
        status: success
        data:
          - serial_number: TEST-SN-0002
            location_name: ''
            is_active: false
          - serial_number: TEST-SN-0001
            location_name: Main Gate
            is_active: true
            last_sync: '2026-09-21 07:00:00'
    HardwarePushPayload:
      type: object
      properties:
        device_sn:
          type: string
          description: Must equal the `SN` query parameter the request was authenticated with (403 otherwise).
        rfid_tag:
          type: string
          description: The student's device User ID. An unknown value is accepted and ignored.
        push_time:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$
          description: Punch time, `YYYY-MM-DD HH:MM:SS`, Asia/Baghdad (400 otherwise).
      required:
        - device_sn
        - rfid_tag
        - push_time
      example:
        device_sn: TEST-SN-0001
