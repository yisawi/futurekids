      operationId: deleteStudent
      summary: Deactivate a student
      description: Sets `is_active = false`. Attendance history and the parent account are kept.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/StudentIdQuery'
      responses:
        '200':
          description: Student deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Student deleted
        '400':
          description: '`id` missing, 0 or not an integer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Invalid student ID
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: No student has this `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Student not found
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/attendance:
    get:
      tags:
        - Admin Dashboard
      operationId: getDailyAttendance
      summary: Daily attendance report
      description: |
        Every active student that existed on the day (added on or before it, by creation date
        in Asia/Baghdad), ordered Present, then Excused, then Absent, by name within each status,
        and by `student_id` for equal names. A student added after the day is not listed. For
        today, a student without a punch is `Absent` even before the check-in window closes at
        09:31; show it as "not arrived yet" until then. For a date that is not a school day
        (`day_type` is `weekend`, `holiday` or `pause`), `data` is empty: show "عطلة نهاية
        الأسبوع" or the closure's `day_title` instead of absences.

        Punches entered by hand (`createManualAttendance`) count exactly like device punches.
        `check_in_source` and `check_out_source` say where the shown times came from (mark
        `manual` ones), and `manual_punches` lists the student's manual entries with the ids
        to delete them.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: The day's attendance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDailyAttendanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/attendance/manual:
    post:
      tags:
        - Admin Dashboard
      operationId: createManualAttendance
      summary: Enter a missing check-in or check-out by hand
      description: |
        For a student whose fingerprint failed (wet finger, device offline, not enrolled yet).
        The entry is a normal punch marked `manual`: the daily report, the dashboard, the Excel
        export, the parent app and the noon absence job treat it exactly like a device punch,
        so a student with a manual check-in gets no absence notification. A manual check-out
        alone also makes an absent student `Present`, as a device check-out does.

        With `notify` (the default) the parent gets the normal notification with the recorded
        time, stored in the same transaction as the entry and pushed to that parent's phones
        after it is saved. An absence notification already sent at 12:00 cannot be recalled:
        review the absent list between 10:00 and 11:30. Call it first with `dry_run: true` and
        show `student_name`, `grade` and `section` in the confirmation. Each request, a dry run
        or a refused one too, is recorded in the activity log as `attendance.manual_create`
        (never the note).
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualAttendanceRequest'
      responses:
        '200':
          description: Recorded, or checked for a dry run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualAttendanceResponse'
        '400':
          $ref: '#/components/responses/ManualAttendanceBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/ManualAttendanceStudentNotFound'
        '409':
          $ref: '#/components/responses/ManualAttendanceConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Admin Dashboard
      operationId: deleteManualAttendance
      summary: Delete a manual entry
      description: |
        Undo a mistaken manual entry from today or yesterday. Device punches are never deleted
        (409). The notification the parent already received stays. Recorded in the activity log
        as `attendance.manual_delete`.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/ManualAttendanceId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualAttendanceDeleteResponse'
        '400':
          $ref: '#/components/responses/ManualAttendanceDeleteBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/ManualAttendanceEntryNotFound'
        '409':
          $ref: '#/components/responses/ManualAttendanceDeleteConflict'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/export/excel:
    get:
      tags:
        - Admin Dashboard
      operationId: exportDailyAttendanceExcel
      summary: Daily attendance as an Excel file
      description: |
        A right-to-left `.xlsx` report (Arabic headers) with student, parent, status and
        check-in/check-out times for every active student that existed on the day (added on or
        before it, by creation date in Asia/Baghdad), including students without a linked
        parent. A student added after the day is not listed. The header shows the `school_name`
        setting. For a date that is not a school day the file has no student rows, and row 4
        names the day: `عطلة نهاية الأسبوع` or the closure's title. The last column,
        `إدخال يدوي`, says which of the shown times were entered by hand: `الدخول`, `الخروج`,
        `الدخول والخروج`, or empty.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: The Excel file.
          headers:
            Content-Disposition:
              description: '`attachment; filename=attendance_<date>.xlsx`'
              schema:
                type: string
              example: attachment; filename=attendance_2026-09-21.xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/leaves:
    post:
      tags:
        - Admin Dashboard
      operationId: createLeave
      summary: Record an excused absence
      description: |
        Records a leave for an active student and a day. Re-submitting the same student and day
        updates the notes. A student id with no active student (unknown or deactivated) returns 404.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeavePayload'
      responses:
        '200':
          description: Leave recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveResponse'
        '400':
          description: Malformed JSON; `student_id` missing, 0 or negative; `leave_date` missing, not `YYYY-MM-DD`, or with a year outside 2000 to 2100.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: leave_date must be formatted as YYYY-MM-DD
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: No active student has this `student_id` (unknown or deactivated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Student not found
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          description: Database error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Failed to create leave record
    delete:
      tags:
        - Admin Dashboard
      operationId: cancelLeave
      summary: Cancel a student's leave on one day
      description: |
        Removes the leave of `student_id` on `date`. The student is then `Absent` for that day in
        the reports (unless they punched in a window), and the noon absence notification applies
        again if it has not run yet. Idempotent: the answer is the same 200 whether or not a leave
        existed, including for an unknown student, so a retry never fails.
      security:
        - AdminJWT: []
      parameters:
        - name: student_id
          in: query
          required: true
          description: The student's id. Missing, zero, negative or not an integer returns 400.
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 42
        - name: date
          in: query
          required: true
          description: The day of the leave, `YYYY-MM-DD`, a real date with a year from 2000 to 2100. Missing or any other value returns 400.
          schema:
            type: string
            format: date
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          example: '2026-09-21'
      responses:
        '200':
          description: No leave remains for this student on this date (one was removed, or there was none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: No leave remains for this student on this date
        '400':
          description: '`student_id` or `date` missing or invalid. Nothing was changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  summary: A parameter is missing
                  value:
                    status: error
                    message: student_id and date are required
                badStudentID:
                  summary: student_id is not a positive integer
                  value:
                    status: error
                    message: student_id must be a positive student id
                badDate:
                  summary: date is not YYYY-MM-DD
                  value:
                    status: error
                    message: date must be formatted as YYYY-MM-DD
                yearOutOfRange:
                  summary: Year outside 2000 to 2100
                  value:
                    status: error
                    message: date must have a year from 2000 to 2100
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/settings:
    get:
      tags:
        - Admin Dashboard
      operationId: listSettings
      summary: All settings
      security:
        - AdminJWT: []
      responses:
        '200':
