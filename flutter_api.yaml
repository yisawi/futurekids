        - subject_name
        - teacher_name
        - subject_key
      example:
        student_id: 42
        student_name: Sara Example
        grade: G3
        section: A
        day_of_week: الأحد
        period_number: 1
        subject_name: Mathematics
        teacher_name: Teacher Example
        subject_key: math
    ScheduleResponse:
      type: object
      properties:
        status:
          type: string
