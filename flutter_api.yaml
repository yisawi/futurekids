      summary: Teachers' punches on a day
      description: |
        For the date (default today in Asia/Baghdad): every `active` teacher added on or before
        it, and every teacher of any status with at least one punch that day. Teachers with
        punches come first, by first punch; then the others by name.

        `first_punch` is the earliest punch and `last_punch` the latest (null when there is only
        one). `not_punched` is true for an `active` teacher without punches on a school day that is
