      operationId: upsertSetting
      summary: Create or replace a setting
      description: Only `whatsapp_number` and `school_name` are visible to parents (`GET /api/mobile/settings`).
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingPayload'
      responses:
        '200':
          description: Setting saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Setting saved
        '400':
          description: Malformed JSON, an empty `key`, or a `key` longer than 100 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Invalid payload
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/schedule:
    get:
      tags:
        - Admin Dashboard
      operationId: getAdminSchedule
      summary: One class's weekly schedule
      description: |
        The schedule of the class `grade` + `section`, Sunday to Thursday, then by
        `period_number`, each with its `subject_key`. A class with no schedule returns 200 with an
        empty `data`. Take the classes from `GET /api/admin/schedule/classes`. Rows saved before
        API 1.13.0 that break the 5-or-6 rule are returned as stored until the class is saved
        again.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/ScheduleGrade'
        - $ref: '#/components/parameters/ScheduleSection'
      responses:
        '200':
          description: The class's schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminScheduleResponse'
        '400':
          $ref: '#/components/responses/ScheduleBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Admin Dashboard
      operationId: replaceAdminSchedule
      summary: Replace one class's weekly schedule
      description: |
        Replaces the whole schedule of one class in a single transaction: every stored period of
        that class is removed and `periods` is stored instead. **An empty `periods` array clears
        the class.** Other classes are never changed. A request that fails (400 or 500) changes
        nothing. Saves of schedules run one at a time, so two saves for the same class at once
        leave exactly one of them. The response is the saved schedule, as `GET` returns it.
        Parents see it in `GET /api/mobile/schedule` for every active child whose `grade` and
        `section` are equal to the saved ones. Breaking in API 1.13.0: every day that has periods
        must have exactly periods 1 to 5 or 1 to 6 (at most 30 periods).
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminScheduleRequest'
      responses:
        '200':
          description: Saved; the class's schedule as now stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminScheduleResponse'
        '400':
          $ref: '#/components/responses/ScheduleBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/schedule/classes:
    get:
      tags:
        - Admin Dashboard
      operationId: listScheduleClasses
      summary: Every known class, for the schedule overview
      description: |
        Every class the school has: the grade and section pairs of active students (both
        non-blank) together with every class that has stored periods, with the number of
        students, periods and days of each. A class with `student_count` 0 has a schedule no
        parent sees; one with `period_count` 0 has no schedule yet.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: The classes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleClassListResponse'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/schedule/export:
    get:
      tags:
        - Admin Dashboard
      operationId: exportScheduleExcel
      summary: One class's weekly schedule as an editable Excel file
      description: |
        The schedule of exactly one class, `grade` + `section`, which must be a known class (as
        in `GET /api/admin/schedule/classes`: an active student or a stored period has exactly
        this pair; 404 otherwise). There is no whole-school export.

        A right-to-left `.xlsx` (one worksheet, `Sheet1`) with the same header as the daily
        report: the ministry line, the `school_name` setting and the title with the class (for
        example `الجدول الأسبوعي - G1 A`) in rows 1 to 3, the column headers
        `المرحلة | الشعبة | اليوم | الحصة | المادة | المعلم` in row 5, and the data from row 6. It is
        an **editable grid** of 30 rows: one for each day Sunday to Thursday and each period 1 to
        6, with the stored subject and teacher, or blank cells. A day with 5 periods therefore has
        a blank sixth row, and a class without a schedule downloads as a blank template. Every
        cell is text, never a formula. Rows saved before API 1.13.0 on another day or with a
        period above 6 are not in the file, so importing it removes them from the class.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/ScheduleExportGrade'
        - $ref: '#/components/parameters/ScheduleExportSection'
      responses:
        '200':
          description: The Excel file.
          headers:
            Content-Disposition:
              description: |
                An attachment named `schedule_<grade>_<section>_<today>.xlsx` (today in
                Asia/Baghdad). Spaces, path separators, quotes, control characters and
                `* : ? < > | ; , %` in the class become `_`. An ASCII name is sent as
                `filename=`; a name with Arabic or other non-ASCII letters only as the RFC 2231
                `filename*=utf-8''…` form (percent-encoded UTF-8). Any standard parser (for example
                `mime.ParseMediaType`) decodes both.
              schema:
                type: string
              examples:
                ascii:
                  value: attachment; filename=schedule_G1_A_2026-10-09.xlsx
                arabic:
                  value: attachment; filename*=utf-8''schedule_G1_%D8%A3_2026-10-09.xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ScheduleExportBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/ScheduleClassNotFound'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/schedule/import:
    post:
      tags:
        - Admin Dashboard
      operationId: importScheduleExcel
      summary: Replace the schedules of the classes in an Excel file
      description: |
        Reads every worksheet whose header row (one of its first 10 rows, with at least three of
        the six names) names the columns; other worksheets are ignored. Columns are found by
        name, in any order; extra columns are ignored; all six are required. Header names
        (hamza, ta marbuta and case don't matter): `المرحلة`/`الصف`/`grade`, `الشعبة`/`section`,
        `اليوم`/`day`, `الحصة`/`period`, `المادة`/`subject`, `المعلم`/`المدرس`/`teacher`.

        **Rows:** a row whose subject and teacher are both blank is ignored (so the blank rows of
        the export don't matter). Otherwise: grade and section 1 to 50 characters, stored exactly
        as written apart from surrounding spaces (a number cell becomes its plain number text);
        day Sunday to Thursday in Arabic or English, as for `PUT /api/admin/schedule`; period a
        whole number 1 to 6 (number or text cells, Arabic-Indic or Persian digits); subject 1 to
        100 characters; teacher up to 100 (blank is none). A teacher without a subject is an
        error. Formulas are never evaluated: their saved values are used, and a formula without a
        saved value is an error. Each class's days must follow the 5-or-6 rule, and a day and
        period may appear once per class (also across worksheets).

        **Saving:** every class (grade and section pair) in the file is **fully replaced**, as
        with `PUT /api/admin/schedule`, including days missing from the file; classes not in the
        file are untouched. To clear a class, use `PUT` with an empty `periods`. It is all or
        nothing: any problem saves nothing. Imports and `PUT` saves run one at a time. Always call
        it with `dry_run=true` first and show the problems or warnings.

        **One class (the dashboard's per-class Import):** send the `grade` and `section` parts
        (both or neither). Then every filled row must belong to that class: a row of another
        class is an error item on its `المرحلة` (or `الشعبة`) cell, and a file without any filled
        row of the class returns 400. `classes` then has one item. Without the two parts, every
        class in the file is imported as described above.

        Limits: at most 2000 filled rows (ignored blank rows don't count) and 100 classes.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScheduleImportRequest'
      responses:
        '200':
          description: Checked (and saved unless `dry_run` was `true`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleImportResponse'
        '400':
          $ref: '#/components/responses/ScheduleImportBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '413':
          $ref: '#/components/responses/ScheduleImportTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/broadcasts:
    get:
      tags:
        - Admin Dashboard
      operationId: listBroadcasts
      summary: The sent log of broadcast notifications
      description: |
        Broadcasts are notifications the admin sent to parents, not banners (pictures).
        Every broadcast sent, newest first, 50 per page (`before`, `has_more` and
        `next_before` work as in `GET /api/mobile/notifications`), with its audience, how many
        parents received it and how many have read it.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/BroadcastBefore'
      responses:
        '200':
          description: A page of the sent log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastPage'
        '400':
          $ref: '#/components/responses/BroadcastCursorBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Admin Dashboard
      operationId: createBroadcast
      summary: Send a broadcast notification to parents
      description: |
        A broadcast is a notification the admin sends to parents (dashboard label "الإشعارات"). It is
        not a banner: banners are the pictures on the parent home screen (`/api/admin/banners`,
        dashboard label "الإعلانات").

        Sends a title and body to an audience of parents (see `BroadcastAudience`): every
        parent, one parent, a grade, a section or a class. Each recipient gets an unread
        notification in `GET /api/mobile/notifications` (it counts in `unread_count` like any
        other), and a push to each of their devices. The push is sent in the background after
        the broadcast is saved; it never delays or fails this request, and without Firebase
        only the notifications are created.

        Send it twice: first with `dry_run: true` to get `recipient_count` for a confirmation
        dialog (nothing is written), then without it. The same title, body and audience within
        60 seconds returns 409. **A broadcast cannot be edited, recalled or deleted after it
        is sent.**
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastCreateRequest'
      responses:
        '200':
          description: Sent, or counted for a dry run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastCreateResponse'
        '400':
          $ref: '#/components/responses/BroadcastBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/BroadcastParentNotFound'
        '409':
          $ref: '#/components/responses/BroadcastDuplicate'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/holidays:
    get:
      tags:
        - Admin Dashboard
      operationId: listHolidays
      summary: School closures (holidays and pauses)
      description: |
        Without `month`: the closures running today or starting later, for the "closure in
        progress" banner (`active`) and the upcoming list. With `month`: every closure that
        covers a day of that month. Ordered by `start_date`.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/HolidayListMonth'
      responses:
        '200':
          description: The closures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Admin Dashboard
      operationId: createHoliday
      summary: Register a holiday or a pause
      description: |
        A closed day is not a school day for everyone: no absences are counted, the noon
        absence notification is not sent, and punches are stored without check-in or check-out
        notifications. Logins, leaves, broadcasts and storing punches are not affected.
        Register a closure for today before 12:00: the noon absence notification and the
        morning punch notifications already sent cannot be recalled.

        With `notify` (the default) every parent gets one notification, in the same transaction
        as the closure, and a push after it is saved, even for a future date. Its title is
        `title`, its body `notes`, or without notes:
        - one-day holiday: `عطلة رسمية يوم <start_date>`;
        - holiday range: `عطلة رسمية من <start_date> إلى <end_date>`;
        - pause: `تعطيل الدوام اعتباراً من <start_date>`, followed by ` حتى <end_date>` when it
          has an end.

        Nothing is sent for a holiday entirely before today, or when there are no parents
        (`notified` false, `recipient_count` 0). Call it first with `dry_run: true` for the
        confirmation dialog (school days and recipients). There is no edit: cancel and create
        again.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolidayCreateRequest'
      responses:
        '200':
          description: Registered, or checked for a dry run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayCreateResponse'
        '400':
          $ref: '#/components/responses/HolidayBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '409':
          $ref: '#/components/responses/HolidayOverlap'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/holidays/cancel:
    post:
      tags:
        - Admin Dashboard
      operationId: cancelHoliday
      summary: Cancel a closure from today onward
      description: |
        One rule for holidays and pauses: a closure that has not started is deleted; one that
        is running is shortened to end yesterday, so the days already passed stay closed and
        past reports do not change (deleted when it started today); one that ended before today
        returns 409.

        With `notify` (the default) every parent gets one notification:
        - not started: title `تم إلغاء العطلة`, body `تم إلغاء: <title>`;
        - started: title `تم إنهاء العطلة واستئناف الدوام`, body `عاد الدوام اعتباراً من
          <date>: <title>`, where the date is the first Sunday-to-Thursday on or after today.

        `notes`, when sent, follow after a blank line; the closure's title inside the body is
        shortened when the text would exceed 500 characters. Use `dry_run: true` for the
        confirmation dialog.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolidayCancelRequest'
      responses:
        '200':
          description: Cancelled, or computed for a dry run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayCancelResponse'
        '400':
          $ref: '#/components/responses/HolidayCancelBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/HolidayNotFound'
        '409':
          $ref: '#/components/responses/HolidayAlreadyOver'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/teachers:
    get:
      tags:
