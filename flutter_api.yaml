            - success
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleEntry'
      required:
        - status
        - data
      example:
        status: success
        data:
          - student_id: 42
            student_name: Sara Example
            grade: G3
            section: A
            day_of_week: الأحد
            period_number: 1
            subject_name: Mathematics
            teacher_name: Teacher Example
            subject_key: math
          - student_id: 42
            student_name: Sara Example
            grade: G3
            section: A
            day_of_week: الأحد
            period_number: 2
            subject_name: Science
            teacher_name: ''
            subject_key: science
    AdminSchedulePeriod:
      type: object
      properties:
        day_of_week:
          type: string
          description: |
            A school day, Sunday to Thursday. Accepted: the Arabic names with or without hamza
            (`الأحد`/`الاحد`, `الإثنين`/`الاثنين`, `الثلاثاء`, `الأربعاء`/`الاربعاء`, `الخميس`) and the
            English names (`Sunday` … `Thursday`) in any case, with surrounding spaces ignored. They
            are stored and returned as `الأحد`, `الإثنين`, `الثلاثاء`, `الأربعاء`, `الخميس`. Friday,
            Saturday or anything else returns 400.
        period_number:
          type: integer
          format: int32
          minimum: 1
          maximum: 6
          description: |
            1 to 6 (400 otherwise). Each day and period pair may appear only once per request
            (400). A day that has periods must have exactly periods 1 to 5 or 1 to 6 (see
            `AdminScheduleRequest.periods`).
        subject_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Required; surrounding spaces are removed, and blank returns 400. Longer than 100 characters returns 400.
        teacher_name:
          type: string
          nullable: true
          maxLength: 100
          description: Optional. Surrounding spaces are removed; omitted, null or blank is stored as null. Longer than 100 characters returns 400.
      required:
        - day_of_week
        - period_number
        - subject_name
      example:
        day_of_week: الأحد
        period_number: 1
        subject_name: Mathematics
        teacher_name: Teacher Example
    AdminScheduleRequest:
      type: object
      properties:
        grade:
          type: string
          minLength: 1
          maxLength: 50
          description: |
            Required. Surrounding spaces are removed; otherwise stored exactly as sent (no case
            folding). Use the grade exactly as the class's students have it: the parent app shows
            the schedule to children whose grade and section are equal to these.
        section:
          type: string
          minLength: 1
          maxLength: 50
          description: Required. Same rules as `grade`.
        periods:
          type: array
          maxItems: 30
          description: |
            The class's whole schedule (at most 5 days × 6 periods = 30). **Every day that has
            periods must have exactly 5 or 6 of them, numbered 1 to 5 or 1 to 6, with no gaps and
            no repeats**; a day can be left out entirely, and different days can have 5 or 6.
            Anything else returns 400 naming the day. It replaces every stored period of this
            class, including rows entered earlier in other spellings. **An empty array clears the
            class's schedule.** Missing or null returns 400, so a client bug cannot clear a class
            by accident. A `subject_key` sent back in a period is ignored.
          items:
            $ref: '#/components/schemas/AdminSchedulePeriod'
      required:
        - grade
        - section
        - periods
      example:
        grade: G3
        section: A
        periods:
          - day_of_week: الأحد
            period_number: 1
            subject_name: الرياضيات
            teacher_name: معلم تجريبي 1
          - day_of_week: الأحد
            period_number: 2
            subject_name: العلوم
            teacher_name: null
          - day_of_week: Sunday
            period_number: 3
            subject_name: اللغة العربية
            teacher_name: معلمة تجريبية 2
          - day_of_week: الاحد
            period_number: 4
            subject_name: اللغة الإنكليزية
            teacher_name: null
          - day_of_week: الأحد
            period_number: 5
            subject_name: التربية الفنية
            teacher_name: null
    AdminScheduleEntry:
      type: object
      properties:
        day_of_week:
          type: string
          description: |
            One of `الأحد`, `الإثنين`, `الثلاثاء`, `الأربعاء`, `الخميس` for every period saved
            through `PUT /api/admin/schedule` or the Excel import. Rows entered directly in the
            database before keep their stored spelling until the class is saved once.
        period_number:
          type: integer
          format: int32
          description: |
            1 to 6 for schedules saved since API 1.13.0. Rows saved earlier keep their number
            (it can be higher) until the class is saved again.
        subject_name:
          type: string
        teacher_name:
          type: string
          nullable: true
          description: Null when not set.
        subject_key:
          $ref: '#/components/schemas/SubjectKey'
      required:
        - day_of_week
        - period_number
        - subject_name
        - teacher_name
        - subject_key
      example:
        day_of_week: الأحد
        period_number: 2
        subject_name: Science
        teacher_name: null
        subject_key: science
    AdminScheduleResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        grade:
          type: string
          description: The class, with surrounding spaces removed.
        section:
          type: string
        data:
          type: array
          description: |
            The class's periods, Sunday to Thursday, then by `period_number` (the order
            `GET /api/mobile/schedule` uses). Empty when the class has no schedule.
          items:
            $ref: '#/components/schemas/AdminScheduleEntry'
      required:
        - status
        - grade
        - section
        - data
      example:
        status: success
        grade: G3
        section: A
        data:
          - day_of_week: الأحد
            period_number: 1
            subject_name: الرياضيات
            teacher_name: معلم تجريبي 1
            subject_key: math
          - day_of_week: الأحد
            period_number: 2
            subject_name: العلوم
            teacher_name: null
            subject_key: science
          - day_of_week: الأحد
            period_number: 3
            subject_name: اللغة العربية
            teacher_name: معلمة تجريبية 2
            subject_key: arabic
          - day_of_week: الأحد
            period_number: 4
            subject_name: اللغة الإنكليزية
            teacher_name: null
            subject_key: english
          - day_of_week: الأحد
            period_number: 5
            subject_name: التربية الفنية
            teacher_name: null
            subject_key: art
    SubjectKey:
      type: string
      enum:
        - math
        - pe
        - arabic
        - english
        - islamic
        - computer
        - science
        - social
        - art
        - music
        - other
      description: |
        Read-only. The subject's family, computed by the server from `subject_name` so the app
        can pick an icon without matching Arabic spellings: `math` (رياضيات, حساب), `pe` (رياضة,
        تربية رياضية/بدنية), `arabic` (عربي, قراءة), `english` (إنكليزي/إنجليزي), `islamic`
        (إسلامية, قرآن, دينية), `computer` (حاسوب, حاسب, كمبيوتر, معلوماتية), `science` (علوم),
        `social` (اجتماعيات, جغرافية, تاريخ, وطنية), `art` (فنية, رسم), `music` (موسيقى, نشيد), and
        `other` for anything else. Hamza, ta marbuta, alef maqsura, diacritics, tatweel, case and
        extra spaces don't matter; English names (Mathematics, Science, English…) are recognized
        as whole words. Never send it: a `subject_key` in a request is ignored. New values may be
        added in a later minor version, so map unknown values to the `other` icon.
      example: math
    ScheduleClass:
      type: object
      properties:
        grade:
          type: string
        section:
          type: string
        student_count:
          type: integer
          format: int32
          minimum: 0
          description: Active students with exactly this grade and section.
        period_count:
          type: integer
          format: int32
          minimum: 0
          description: Stored periods of this class (0 when it has no schedule).
        day_count:
          type: integer
          format: int32
          minimum: 0
          description: Distinct days among the stored periods (one day stored in two spellings counts once).
      required:
        - grade
        - section
        - student_count
        - period_count
        - day_count
      example:
        grade: G3
        section: A
        student_count: 24
        period_count: 28
        day_count: 5
    ScheduleClassListResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          description: |
            Every known class: the grade and section pairs of active students (both non-blank)
            together with every class that has stored periods. Ordered by `grade`, then
            `section`, compared as plain stored strings (by Unicode code point); order them for
            display yourself.
          items:
            $ref: '#/components/schemas/ScheduleClass'
      required:
        - status
        - data
      example:
        status: success
        data:
          - grade: G3
            section: A
            student_count: 24
            period_count: 28
            day_count: 5
          - grade: G3
            section: ب
            student_count: 0
            period_count: 30
            day_count: 5
          - grade: G4
            section: A
            student_count: 21
            period_count: 0
            day_count: 0
    ScheduleImportRequest:
      type: object
      description: |
        `multipart/form-data`. Each part is sent at most once (400 otherwise); unknown parts are
        ignored.
      properties:
        file:
          type: string
          format: binary
          description: |
            Required. An Excel workbook (`.xlsx`), at most 2 MiB (2,097,152 bytes; larger returns
            413). Its bytes must be a zip that opens as a workbook and unpacks to at most 20 MiB;
            anything else (CSV, old `.xls`, text renamed to `.xlsx`, an empty file) returns 400
            whatever the file name or the part's Content-Type say. See the operation for the
            columns and rules.
        dry_run:
          type: string
          enum:
            - 'true'
            - 'false'
          default: 'false'
          description: |
            Optional, exactly `true` or `false` (anything else returns 400). With `true` the file
            is checked and the same report is returned, but nothing is saved.
        grade:
          type: string
          minLength: 1
          maxLength: 50
          description: |
            Optional class guard, sent together with `section` (only one of them returns 400).
            Surrounding spaces are removed; blank or longer than 50 characters returns 400. When
            sent, every filled row of the file must have exactly this grade and section (a row
            of another class is an error item), and the file must have at least one such row
            (400 otherwise). Send it exactly as `GET /api/admin/schedule/classes` returns it.
        section:
          type: string
          minLength: 1
          maxLength: 50
          description: Optional class guard, sent together with `grade`; same rules.
      required:
        - file
      example:
        file: (binary .xlsx)
        dry_run: 'true'
        grade: G1
        section: A
    ScheduleImportClass:
      type: object
      properties:
        grade:
          type: string
        section:
          type: string
        periods:
          type: integer
          format: int32
          minimum: 5
          description: Periods stored for this class (its whole schedule after the import).
        matched_students:
          type: integer
          format: int32
          minimum: 0
          description: Active students with exactly this grade and section, who see it in the parent app.
      required:
        - grade
        - section
        - periods
        - matched_students
      example:
        grade: G3
        section: A
        periods: 28
        matched_students: 24
    ScheduleImportResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        message:
          type: string
        dry_run:
          type: boolean
          description: True when nothing was saved.
        total_periods:
          type: integer
          format: int32
          minimum: 0
        classes:
          type: array
          description: Every class in the file, ordered by `grade`, then `section` (plain strings).
          items:
            $ref: '#/components/schemas/ScheduleImportClass'
        warnings:
          type: array
          description: |
            One text per class that no active student has (`matched_students` is 0): its schedule
            is saved but no parent sees it, usually because of a typo in the grade or section.
            Show these before the admin confirms.
          items:
            type: string
      required:
        - status
        - message
        - dry_run
        - total_periods
        - classes
        - warnings
      example:
        status: success
        message: 'Dry run: the file is valid; nothing was saved'
        dry_run: true
        total_periods: 58
        classes:
          - grade: G3
            section: A
            periods: 28
            matched_students: 24
          - grade: G3
            section: ب
            periods: 30
            matched_students: 0
        warnings:
          - 'grade G3, section ب: no active student has this grade and section, parents will not see it'
    ScheduleImportError:
      type: object
      description: |
        One problem in the file. `sheet` is the worksheet's name, `row` the Excel row number (as
        Excel shows it) and `column` the column's standard header name (`المرحلة`, `الشعبة`,
        `اليوم`, `الحصة`, `المادة` or `المعلم`), whatever header the file used. The last item of a
        capped list has only `message` (for example `and 12 more problems`).
      properties:
        sheet:
          type: string
        row:
          type: integer
          format: int32
          minimum: 1
        column:
          type: string
          enum:
            - المرحلة
            - الشعبة
            - اليوم
            - الحصة
            - المادة
            - المعلم
        message:
          type: string
      required:
        - message
      example:
        sheet: Sheet1
        row: 9
        column: اليوم
        message: day must be a school day, Sunday to Thursday (Arabic or English)
    ScheduleImportErrorResponse:
      type: object
      description: |
        The error envelope, with `errors` (the one extension of it) when the problems are in the
        file's rows: at most 50 problems, then one item saying how many more there are. Other 400s
        from the import (not multipart, no file, not a workbook, no header row, too many rows or
        classes, an invalid `dry_run`, an invalid class guard, no row for the guarded class) have
        no `errors`.
      properties:
        status:
          type: string
          enum:
            - error
        message:
          type: string
        errors:
          type: array
          maxItems: 51
          items:
            $ref: '#/components/schemas/ScheduleImportError'
      required:
        - status
        - message
      example:
        status: error
        message: The file has 2 problems; nothing was saved
        errors:
          - sheet: Sheet1
            row: 9
            column: اليوم
            message: day must be a school day, Sunday to Thursday (Arabic or English)
          - sheet: Sheet1
            row: 12
            column: الحصة
            message: grade G3, section A has periods 1, 2, 3, 4 on الإثنين; a school day must have exactly 5 or 6 periods, numbered 1 to 5 or 1 to 6
    AdminBanner:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
          nullable: true
          maxLength: 255
          description: Null when not set.
        action_link:
          type: string
          nullable: true
          maxLength: 2048
          description: Absolute `http`/`https` link opened on tap; null when not set.
        is_active:
          type: boolean
          description: Only active banners reach parents (`GET /api/mobile/banners`).
        created_at:
          type: string
          format: date-time
          nullable: true
          description: RFC 3339 in Asia/Baghdad (`+03:00`). Null only for rows entered by hand without a date.
        image_url:
          type: string
          description: |
            The same value parents receive: `/api/mobile/banners/image?id=<id>` (relative to the API
            base URL) for an uploaded picture, otherwise the URL stored for an older banner. To
            preview any banner, active or not, use `GET /api/admin/banners/image?id=<id>` with the
            admin token.
        image_content_type:
          type: string
          nullable: true
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - null
          description: Type detected from the uploaded bytes; null for a banner without an uploaded picture.
        image_size_bytes:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 2097152
          description: Size of the uploaded picture; null without one.
      required:
        - id
        - title
        - action_link
        - is_active
        - created_at
        - image_url
        - image_content_type
        - image_size_bytes
      example:
        id: 5
        title: Open day
        action_link: https://example.com/open-day
        is_active: true
        created_at: '2026-09-21T09:30:00+03:00'
        image_url: /api/mobile/banners/image?id=5
        image_content_type: image/jpeg
        image_size_bytes: 284113
    AdminBannerResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          $ref: '#/components/schemas/AdminBanner'
      required:
        - status
        - data
      example:
        status: success
        data:
          id: 5
          title: Open day
          action_link: https://example.com/open-day
          is_active: true
          created_at: '2026-09-21T09:30:00+03:00'
          image_url: /api/mobile/banners/image?id=5
          image_content_type: image/jpeg
          image_size_bytes: 284113
    AdminBannerListResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          description: Every banner, active or not, newest first (by `created_at`, then `id`). Never picture bytes.
          items:
            $ref: '#/components/schemas/AdminBanner'
      required:
        - status
        - data
      example:
        status: success
        data:
          - id: 5
            title: Open day
            action_link: null
            is_active: false
            created_at: '2026-09-21T09:30:00+03:00'
            image_url: /api/mobile/banners/image?id=5
            image_content_type: image/png
            image_size_bytes: 91230
          - id: 2
            title: null
            action_link: https://example.com/sports
            is_active: true
            created_at: '2026-01-03T10:00:00+03:00'
            image_url: https://example.com/banners/sports.jpg
            image_content_type: null
            image_size_bytes: null
    BannerCreateRequest:
      type: object
      description: |
        `multipart/form-data`. Each field is sent at most once (400 otherwise); unknown parts are
        ignored.
      properties:
        image:
          type: string
          format: binary
          description: |
            Required. The picture, at most 2 MiB (2,097,152 bytes; larger returns 413). Its type
            is detected from its bytes and must be JPEG, PNG or WebP; anything else (SVG, GIF,
            BMP, text) returns 400 whatever the file name or the part's Content-Type say. An
            empty file returns 400. Resize and compress it before uploading.
        title:
          type: string
          maxLength: 255
          description: Optional. Surrounding spaces are removed; blank stores null. Longer than 255 characters returns 400.
        action_link:
          type: string
          maxLength: 2048
          description: |
            Optional. Surrounding spaces are removed; blank stores null. Otherwise it must be an
            absolute `http` or `https` URL with a host (`javascript:`, `data:`, `intent:`,
            relative links and other schemes return 400). Longer than 2048 characters returns 400.
        is_active:
          type: string
          enum:
            - 'true'
            - 'false'
          default: 'true'
          description: Optional, exactly `true` or `false` (anything else returns 400). Defaults to `true`.
      required:
        - image
      example:
        image: (binary JPEG, PNG or WebP)
        title: Open day
        action_link: https://example.com/open-day
        is_active: 'true'
    BannerUpdateRequest:
      type: object
      description: |
        `multipart/form-data`. Every part is optional; a part that is sent replaces that value and
        an omitted part keeps it. Sending none of `image`, `title`, `action_link`, `is_active`
        returns 400. Each field is sent at most once.
      properties:
        image:
          type: string
          format: binary
          description: Replaces the stored picture. Same rules as on create.
        title:
          type: string
          maxLength: 255
          description: Same rules as on create; blank clears the title.
        action_link:
          type: string
          maxLength: 2048
          description: Same rules as on create; blank clears the link.
        is_active:
          type: string
          enum:
            - 'true'
            - 'false'
          description: '`false` hides the banner from parents without deleting it; `true` shows it again.'
      example:
        title: Open day (updated)
        is_active: 'false'
    Notification:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
        body:
          type: string
        is_read:
          type: boolean
          description: |
            False until the parent marks it read with `PUT /api/mobile/notifications/read?id=` or
            `PUT /api/mobile/notifications/read-all`. New notifications always arrive unread.
        created_at:
          type: string
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+03:00$
          description: RFC 3339 in Asia/Baghdad (always `+03:00`).
      required:
        - id
        - title
        - body
        - is_read
        - created_at
      example:
        id: 1502
        title: إشعار دخول
        body: تم تسجيل دخول الطالب Sara Example الساعة 07:15
        is_read: false
        created_at: '2026-09-21T07:15:04+03:00'
    NotificationPage:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          maxItems: 100
          description: Newest first (descending id).
          items:
            $ref: '#/components/schemas/Notification'
        has_more:
          type: boolean
          description: True when older notifications exist.
        next_before:
          type: integer
          format: int32
          nullable: true
          description: The id of the last item on this page. Pass it as `before` for the next page; null when `has_more` is false.
        unread_count:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many of the parent's notifications are unread in total, across all pages (not just
            this page). The same on every page; use it for the unread badge.
      required:
        - status
        - data
        - has_more
        - next_before
        - unread_count
      example:
        status: success
        data:
          - id: 1502
            title: إشعار دخول
            body: تم تسجيل دخول الطالب Sara Example الساعة 07:15
            is_read: false
            created_at: '2026-09-21T07:15:04+03:00'
        has_more: false
        next_before: null
        unread_count: 1
    BroadcastAudience:
      type: object
      description: |
        Who receives the broadcast. `type` decides which other fields are allowed; a field
        that is not allowed returns 400 even when blank, so a dashboard bug can never widen the
        audience. A field sent as null counts as not sent.
        - `all`: every parent in the system, including parents whose children are all
          deactivated. `grade`, `section` and `parent_phone` must not be sent.
        - `parent`: one parent. `parent_phone` is required, in any format parent login accepts
          (`07…`, `+964…`, `00964…`, Arabic-Indic digits, spaces); `grade` and `section` must
          not be sent. Not an Iraqi mobile number: 400. No parent has it: 404.
        - `class`: the distinct parents of the **active** students whose grade and/or section
          match exactly (case-sensitive, surrounding spaces ignored), as the weekly schedule
          matches them. `grade` only: the whole grade (every section); `section` only: that
          section in every grade; both: one class. At least one is required, 1 to 50 characters
          each; `parent_phone` must not be sent. A parent with several matching children gets
          one notification.
      properties:
        type:
          type: string
          enum:
            - all
            - parent
            - class
        grade:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
        section:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
        parent_phone:
          type: string
          nullable: true
      required:
        - type
      example:
        type: class
        grade: G3
        section: A
    BroadcastCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Required; surrounding spaces are removed; 1 to 100 characters (blank, longer, NUL or invalid UTF-8 returns 400).
        body:
          type: string
          minLength: 1
          maxLength: 500
          description: Required; surrounding spaces are removed; 1 to 500 characters (same rules as `title`).
        audience:
          $ref: '#/components/schemas/BroadcastAudience'
        dry_run:
          type: boolean
          default: false
          description: |
            Optional. With `true` the request is checked and the recipients are counted, but
            nothing is written and nothing is sent. Use it for the confirmation dialog. Anything
            but `true`, `false` or null returns 400.
      required:
        - title
        - body
        - audience
      example:
        title: اجتماع أولياء الأمور
        body: يوم الخميس الساعة العاشرة صباحاً في قاعة المدرسة.
        audience:
          type: class
          grade: G3
          section: A
        dry_run: true
    BroadcastCreateResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        message:
          type: string
          description: '`Broadcast sent`, or `Preview only` for a dry run.'
        data:
          type: object
          properties:
            id:
              type: integer
              format: int32
              nullable: true
              description: The new broadcast's id; null for a dry run.
            recipient_count:
              type: integer
              format: int32
              minimum: 1
              description: How many parents receive it (or would, for a dry run).
            dry_run:
              type: boolean
          required:
            - id
            - recipient_count
            - dry_run
      required:
        - status
        - message
        - data
      example:
        status: success
        message: Preview only
        data:
          id: null
          recipient_count: 24
          dry_run: true
    BroadcastLogAudience:
      type: object
      description: |
        The audience as sent. Fields the type does not use are null. For `parent`,
        `parent_name` and `parent_phone` are that parent's current values, or null if the
        parent was deleted since.
      properties:
        type:
          type: string
          enum:
            - all
            - parent
            - class
        grade:
          type: string
          nullable: true
        section:
          type: string
          nullable: true
        parent_name:
          type: string
          nullable: true
        parent_phone:
          type: string
          nullable: true
      required:
        - type
        - grade
        - section
        - parent_name
        - parent_phone
      example:
        type: parent
        grade: null
        section: null
        parent_name: Omar Example
        parent_phone: '+9647000000101'
    BroadcastLogItem:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        body:
          type: string
        audience:
          $ref: '#/components/schemas/BroadcastLogAudience'
        recipient_count:
          type: integer
          format: int32
          minimum: 0
          description: How many parents received it.
        read_count:
          type: integer
          format: int32
          minimum: 0
          description: How many of its notifications the parents have marked read so far.
        created_at:
          type: string
          format: date-time
          description: When it was sent, RFC 3339 in Asia/Baghdad (+03:00).
      required:
        - id
        - title
        - body
        - audience
        - recipient_count
        - read_count
        - created_at
      example:
        id: 120
        title: اجتماع أولياء الأمور
        body: يوم الخميس الساعة العاشرة صباحاً في قاعة المدرسة.
        audience:
          type: class
          grade: G3
          section: A
          parent_name: null
          parent_phone: null
        recipient_count: 24
        read_count: 17
        created_at: '2026-10-10T09:15:00+03:00'
    BroadcastPage:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          maxItems: 50
          description: Newest first (descending id).
          items:
            $ref: '#/components/schemas/BroadcastLogItem'
        has_more:
          type: boolean
          description: True when older broadcasts exist.
        next_before:
          type: integer
          format: int32
          nullable: true
          description: The id of the last item on this page. Pass it as `before` for the next page; null when `has_more` is false.
      required:
        - status
        - data
        - has_more
        - next_before
      example:
        status: success
        data:
          - id: 120
            title: اجتماع أولياء الأمور
            body: يوم الخميس الساعة العاشرة صباحاً في قاعة المدرسة.
            audience:
              type: class
              grade: G3
              section: A
              parent_name: null
              parent_phone: null
            recipient_count: 24
            read_count: 17
            created_at: '2026-10-10T09:15:00+03:00'
        has_more: false
        next_before: null
    HolidayCreateRequest:
      type: object
      description: |
        A `holiday` is one day or a date range of at most 60 calendar days. A `pause` is a long
        closure (for example the summer break), open-ended unless `end_date` is sent, that lasts
        until it is cancelled. A closure may not share a date with another one (409). There is
        no edit: cancel the closure and create it again.
      properties:
        kind:
          type: string
          enum:
            - holiday
            - pause
          description: Required. Anything else returns 400.
        start_date:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: |
            Required; a real date with a year from 2000 to 2100. A holiday may start in the past
            (it corrects past reports); a pause may not (400).
        end_date:
          type: string
          nullable: true
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: |
            Optional, inclusive, not before `start_date` (400). Holiday: omitted or null means one
            day, and more than 60 days from start to end inclusive returns 400. Pause: omitted or
            null means open-ended.
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            Required; surrounding spaces are removed; 1 to 80 characters (blank, longer, not a
            string, NUL or invalid UTF-8 returns 400). It is also the notification's title.
        notes:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Optional; surrounding spaces are removed and blank means none; at most 500 characters
            (same text rules as `title`). It is also the notification's body.
        notify:
          type: boolean
          default: true
          description: |
            Optional. Send one notification to every parent. When the whole range is before
            today nothing is sent and `notified` is false. Anything but `true`, `false` or null
            returns 400.
        confirm:
          type: boolean
          default: false
          description: |
            Must be `true` for a pause (400 otherwise), sent after the admin has accepted the
            warning; not needed for a holiday or a dry run. Same type rule as `notify`.
        dry_run:
          type: boolean
          default: false
          description: |
            Optional. With `true` everything is checked, overlaps included, and the recipients are
            counted, but nothing is written or sent. Same type rule as `notify`.
      required:
        - kind
        - start_date
        - title
      example:
        kind: holiday
        start_date: '2026-03-22'
        end_date: '2026-03-26'
        title: عطلة الربيع
        notes: null
        notify: true
        dry_run: true
    HolidayCreateResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        message:
          type: string
          description: '`Closure registered`, or `Preview only` for a dry run.'
        data:
          type: object
          properties:
            id:
              type: integer
              format: int32
              nullable: true
              description: The new closure's id; null for a dry run.
            kind:
              type: string
              enum:
                - holiday
                - pause
            start_date:
              type: string
              format: date
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
            end_date:
              type: string
              nullable: true
              format: date
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
              description: The stored last day; a one-day holiday has `end_date` equal to `start_date`. Null for an open-ended pause.
            school_days:
              type: integer
              format: int32
              nullable: true
              minimum: 0
              description: Sunday-to-Thursday days in the range; null when open-ended.
            notified:
              type: boolean
              description: True when a notification was sent (for a dry run, would be sent).
            recipient_count:
              type: integer
              format: int32
              minimum: 0
              description: Parents who received the notification (or would); 0 when none is sent.
            dry_run:
              type: boolean
          required:
            - id
            - kind
            - start_date
            - end_date
            - school_days
            - notified
            - recipient_count
            - dry_run
      required:
        - status
        - message
        - data
      example:
        status: success
        message: Preview only
        data:
          id: null
          kind: holiday
          start_date: '2026-03-22'
          end_date: '2026-03-26'
          school_days: 5
          notified: true
          recipient_count: 120
          dry_run: true
    HolidayCancelRequest:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          description: Required; the closure's id. Not a positive integer returns 400; an unknown id returns 404.
        notify:
          type: boolean
          default: true
          description: Optional. Send one notification to every parent. Anything but `true`, `false` or null returns 400.
        notes:
          type: string
          nullable: true
          maxLength: 500
          description: Optional; added to the notification's text after a blank line. At most 500 characters; blank means none.
        dry_run:
          type: boolean
          default: false
          description: Optional. With `true` the result is computed and the recipients are counted, but nothing is written or sent.
      required:
        - id
      example:
        id: 12
        notify: true
        dry_run: true
    HolidayCancelResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        message:
          type: string
          description: '`Closure cancelled`, or `Preview only` for a dry run.'
        data:
          type: object
          properties:
            id:
              type: integer
              format: int32
            action:
              type: string
              enum:
                - deleted
                - shortened
              description: |
                `deleted`: the closure had not started, or started today. `shortened`: it was
                running, and now ends yesterday, so the days already passed stay closed.
            end_date:
              type: string
              nullable: true
              format: date
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
              description: The closure's new last day after `shortened` (yesterday); null after `deleted`.
            notified:
              type: boolean
            recipient_count:
              type: integer
              format: int32
              minimum: 0
            dry_run:
              type: boolean
          required:
            - id
            - action
            - end_date
            - notified
            - recipient_count
            - dry_run
      required:
        - status
        - message
        - data
      example:
        status: success
        message: Closure cancelled
        data:
          id: 12
          action: shortened
          end_date: '2026-07-14'
          notified: true
          recipient_count: 120
          dry_run: false
    HolidayItem:
      type: object
      properties:
        id:
          type: integer
          format: int32
        kind:
          type: string
          enum:
            - holiday
            - pause
        start_date:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        end_date:
          type: string
          nullable: true
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: Inclusive; null for an open-ended pause.
        title:
          type: string
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          description: When it was registered, RFC 3339 with the `+03:00` offset.
        active:
          type: boolean
          description: True when the closure covers today; use it for the "closure in progress" banner.
        notified:
          type: boolean
          description: True when a notification was sent when it was registered.
        recipient_count:
          type: integer
          format: int32
          nullable: true
          description: Parents who received that notification; null when none was sent.
      required:
        - id
        - kind
        - start_date
        - end_date
        - title
        - notes
        - created_at
        - active
        - notified
        - recipient_count
      example:
        id: 12
        kind: pause
        start_date: '2026-06-15'
        end_date: null
        title: العطلة الصيفية
        notes: نتمنى لكم عطلة سعيدة.
        created_at: '2026-06-10T10:00:00+03:00'
        active: true
        notified: true
        recipient_count: 120
    HolidayListResponse:
