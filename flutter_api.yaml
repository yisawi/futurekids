        grade:
          type: string
        section:
          type: string
        day_of_week:
          type: string
          description: The day name exactly as the school stored it, usually Arabic (for example `الأحد`), sometimes English.
        period_number:
          type: integer
          format: int32
        subject_name:
          type: string
        teacher_name:
          type: string
          description: Empty string when not set.
        subject_key:
          $ref: '#/components/schemas/SubjectKey'
      required:
        - student_id
