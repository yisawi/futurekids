                $ref: '#/components/schemas/TeacherSpecializationsResponse'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/activity-log:
    get:
      tags:
        - Admin Dashboard
      operationId: listActivityLog
      summary: The admin activity log
      description: |
        What was done in the admin dashboard, newest first, 50 per page (`before`, `has_more` and
        `next_before` work as in `GET /api/admin/broadcasts`). There are no filters. The log is
        read-only: there is no endpoint to edit, delete or export it, and `POST`, `PUT` and
        `DELETE` on this path get the standard JSON 405 with `Allow: GET, HEAD`.

        **Recorded** (one entry per request, after it was answered, with its real status):
        every admin request with a method other than GET, HEAD or OPTIONS, also when it was
        answered 400, 404, 409 or 500; the two Excel exports; and admin login attempts that
        reached the credential check. **Not recorded:** other GET requests (including reading
        this log), requests the admin authentication rejected, login requests answered 429 by
        the rate limit or rejected as malformed, parent and device requests. The one parent
        action recorded is a successful account deletion (`parent.account_delete`).

        Entries hold identifiers and counts only: never passwords, PINs, tokens, names, phone
        numbers, titles, notes or setting values. The one exception is `parent.account_delete`,
        whose `detail` names the unlinked child; the parent's name, phone number and address are
        never stored. Recording is best effort: if the database
        fails at that moment the request is answered as usual and its entry is missing. The
        owner may correct or remove entries directly in the database.

        Action codes (show an unknown code as it is):

        | Code | Request | Target |
        |---|---|---|
        | `login.success`, `login.failed` | `POST /api/admin/login` | none; `actor` is `unknown` for a failure |
        | `student.create`, `student.update`, `student.deactivate` | `POST`, `PUT`, `DELETE /api/admin/students` | `student` id |
        | `device.create`, `device.update`, `device.disable` | `POST`, `PUT`, `DELETE /api/admin/devices` | `device` serial number |
        | `leave.create`, `leave.delete` | `POST`, `DELETE /api/admin/leaves` | `student` id; `detail` has the date |
        | `settings.update` | `PUT /api/admin/settings` | `setting` keys, never values |
        | `schedule.save` | `PUT /api/admin/schedule` | `class` (`grade/section`); `detail` has the period count |
        | `schedule.import` | `POST /api/admin/schedule/import` | `class` when the class guard was sent; `detail` has class and period counts |
        | `broadcast.send` | `POST /api/admin/broadcasts` | `broadcast` id; `detail` has the audience type and recipient count |
        | `holiday.create`, `holiday.cancel` | `POST /api/admin/holidays`, `POST /api/admin/holidays/cancel` | `closure` id; `detail` has the kind (and the cancel action) |
        | `banner.create`, `banner.update`, `banner.delete` | `POST`, `PUT`, `DELETE /api/admin/banners` | `banner` id |
        | `attendance.manual_create`, `attendance.manual_delete` | `POST`, `DELETE /api/admin/attendance/manual` | `student` id; `detail` has the type and date (create: `notify`, `dry_run`; delete: the entry id) |
        | `teacher.create`, `teacher.update` | `POST`, `PUT /api/admin/teachers` | `teacher` id |
        | `export.attendance` | `GET /api/admin/export/excel` | `date` |
        | `export.schedule` | `GET /api/admin/schedule/export` | `class` |
        | `parent.account_delete` | `POST /api/mobile/account/delete` (the parent app; `actor` is `parent`, `ip` null) | one entry per unlinked child: `student` id, `detail` the child's name; a parent without children gives one entry with no target and `detail` `no linked students` |
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/ActivityLogBefore'
      responses:
        '200':
          description: A page of the log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogPage'
        '400':
          $ref: '#/components/responses/ActivityLogCursorBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/banners:
    get:
      tags:
        - Admin Dashboard
      operationId: listAdminBanners
      summary: All banners
      description: Every banner, active or not, newest first, with its picture's metadata but never its bytes.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: Banners.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerListResponse'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Admin Dashboard
      operationId: createBanner
      summary: Upload a new banner
      description: |
        Creates a banner and stores its picture, in one transaction: a request that fails
        creates nothing. Parents see it in `GET /api/mobile/banners` while it is active.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BannerCreateRequest'
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Created; the banner as now stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerResponse'
        '400':
          $ref: '#/components/responses/BannerWriteBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '413':
          $ref: '#/components/responses/BannerTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Admin Dashboard
      operationId: updateBanner
      summary: Change a banner
      description: |
        Changes only the parts sent; omitted parts keep their value. An `image` part replaces the
        picture (and its ETag). One transaction: a request that fails changes nothing.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/BannerIdQuery'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BannerUpdateRequest'
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Updated; the banner as now stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerResponse'
        '400':
          $ref: '#/components/responses/BannerWriteBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/BannerNotFound'
        '413':
          $ref: '#/components/responses/BannerTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Admin Dashboard
      operationId: deleteBanner
      summary: Delete a banner and its picture
      description: Permanent. To hide a banner but keep it, send `is_active=false` with `PUT` instead.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/BannerIdQuery'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Banner deleted
        '400':
          $ref: '#/components/responses/BannerIdBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/BannerNotFound'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/banners/image:
    get:
      tags:
        - Admin Dashboard
      operationId: getAdminBannerImage
      summary: Preview a banner's picture
      description: |
        The uploaded picture of any banner, active or not, exactly as uploaded. Needs the admin
        token (send the `Authorization` header with the image request). Banners without an
        uploaded picture return 404; their picture is at their stored `image_url`.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/BannerIdQuery'
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a copy you already have; 304 when it is still current.
          schema:
            type: string
          example: '"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"'
      responses:
        '200':
          description: The picture.
          headers:
            ETag:
              $ref: '#/components/headers/BannerETag'
            Cache-Control:
              $ref: '#/components/headers/AdminImageCacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified; the copy whose `ETag` was sent in `If-None-Match` is current. No body.
          headers:
            ETag:
              $ref: '#/components/headers/BannerETag'
            Cache-Control:
              $ref: '#/components/headers/AdminImageCacheControl'
        '400':
          $ref: '#/components/responses/BannerIdBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: No banner with this id has an uploaded picture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Banner image not found
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/devices:
    get:
      tags:
        - Admin Dashboard
      operationId: listDevices
      summary: All registered devices
      description: Every device, active or not, ordered by `location_name`.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: Devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Admin Dashboard
      operationId: createDevice
      summary: Register a device
      description: A device registered without `is_active` is active.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
      responses:
        '200':
          description: Device registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Device added successfully
        '400':
          description: Malformed JSON, a missing `serial_number`, or a field longer than its `maxLength`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  summary: serial_number missing
                  value:
                    status: error
                    message: Invalid payload or missing SN
                tooLong:
                  summary: A field longer than its limit
                  value:
                    status: error
                    message: location_name must be at most 50 characters
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '409':
          description: A device with this serial number already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Device SN already exists
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Admin Dashboard
      operationId: updateDevice
      summary: Update a device's location or active flag
      description: |
        Changes only the fields sent; an omitted `location_name` or `is_active` keeps its stored
        value. Send at least one of them.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
      responses:
        '200':
          description: Device updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Device updated successfully
        '400':
          description: Malformed JSON, a missing `serial_number`, neither `location_name` nor `is_active` sent, or a field longer than its `maxLength`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                nothingToChange:
                  summary: Neither field sent
                  value:
                    status: error
                    message: location_name or is_active is required
                missing:
                  summary: serial_number missing
                  value:
                    status: error
                    message: Invalid payload
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: No device has this serial number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Device not found
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Admin Dashboard
      operationId: disableDevice
      summary: Disable a device
      description: |
        Sets `is_active = false`; the device and its attendance history are kept. Answers 200
        even when no device has this serial number.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/DeviceSnQuery'
      responses:
        '200':
          description: Device disabled (or no such device).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Device disabled logically
        '400':
          description: '`sn` missing or empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Missing device SN
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    ParentJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Parent token from `POST /api/mobile/login` (role `parent`, valid 30 days).
    AdminJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin token from `POST /api/admin/login` (role `admin`, valid 7 days).
    DeviceSerial:
      type: apiKey
      in: query
      name: SN
      description: Serial number of a device registered with `POST /api/admin/devices`; it is the device's only credential.
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
      example: 30
    BannerETag:
      description: Strong validator of the picture (SHA-256 of its bytes, in quotes). Send it back in `If-None-Match` to get 304 while the picture is unchanged.
      schema:
        type: string
        pattern: ^"[0-9a-f]{64}"$
      example: '"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"'
    NoSniff:
      description: Always `nosniff`; the picture is only ever its declared type.
      schema:
        type: string
        enum:
          - nosniff
      example: nosniff
    PublicImageCacheControl:
      description: The picture may be reused for 5 minutes, then revalidated with `If-None-Match`.
      schema:
        type: string
        enum:
          - public, max-age=300
      example: public, max-age=300
    AdminImageCacheControl:
      description: The dashboard revalidates the picture on every use (cheap with `If-None-Match`).
      schema:
        type: string
        enum:
          - private, no-cache
      example: private, no-cache
  parameters:
    Date:
      name: date
      in: query
      required: false
      description: |
        Calendar day, `YYYY-MM-DD`, a real date with a year from 2000 to 2100. Defaults to today
        in Asia/Baghdad. Any other value returns 400.
      schema:
        type: string
        format: date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      example: '2026-09-21'
    Month:
      name: month
      in: query
      required: false
      description: |
        Month, `YYYY-MM`, with a year from 2000 to 2100. Defaults to the current month in
        Asia/Baghdad. Any other value returns 400.
      schema:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      example: 2026-09
    HolidayListMonth:
      name: month
      in: query
      required: false
      description: |
        Month, `YYYY-MM`, with a year from 2000 to 2100: the closures that cover at least one day
        of it. Omitted: the closures running today or starting later. Any other value returns 400.
      schema:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      example: 2026-03
    Before:
      name: before
      in: query
      required: false
      description: |
        Cursor: return only notifications with an id lower than this. Pass the `next_before` of
        the previous page. Omit it for the newest page. Not a positive integer: 400.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1402
    BroadcastBefore:
      name: before
      in: query
      required: false
      description: |
        Cursor: return only broadcasts with an id lower than this. Pass the `next_before` of
        the previous page. Omit it for the newest page. Not a positive integer: 400.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 120
    ManualAttendanceId:
      name: id
      in: query
      required: true
      description: |
        The manual entry's id, from `manual_punches` in the daily report or from the create
        response. Missing or not a positive integer: 400.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 90412
    TeacherStatusQuery:
      name: status
      in: query
      required: false
      description: Only teachers with this status.
      schema:
        type: string
        enum:
          - active
          - on_leave
          - transferred
          - retired
      example: active
    TeacherSearchQuery:
      name: search
      in: query
      required: false
      description: |
        Part of the full name (case-insensitive), or at least 3 digits of the phone in any format
        (`0770…`, `+964770…`, Arabic-Indic digits).
      schema:
        type: string
      example: أحمد
    TeacherIdQuery:
      name: id
      in: query
      required: false
      description: Only this teacher (404 when there is none).
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 3
    ActivityLogBefore:
      name: before
      in: query
      required: false
      description: |
        Cursor: return only entries with an id lower than this. Pass the `next_before` of the
        previous page. Omit it for the newest page. Not a positive integer: 400.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 5120
    NotificationIdQuery:
      name: id
      in: query
      required: true
      description: Notification id from the list. Missing, zero or not an integer returns 400.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1502
    StudentIdQuery:
      name: id
      in: query
      required: true
      description: Student id. Missing, zero or not an integer returns 400; an id with no student returns 404.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 42
    DeviceSnQuery:
      name: sn
      in: query
      required: true
      description: Serial number of the device to disable. Missing or empty returns 400.
      schema:
        type: string
        minLength: 1
      example: TEST-SN-0001
    ScheduleGrade:
      name: grade
      in: query
      required: true
      description: |
        The class's grade, as stored on its students (`Student.grade`). Surrounding spaces are
        ignored; otherwise it must match exactly (case-sensitive). Missing or blank returns 400,
        and so does a value longer than 50 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: G3
    ScheduleSection:
      name: section
      in: query
      required: true
      description: |
        The class's section, as stored on its students (`Student.section`). Surrounding spaces
        are ignored; otherwise it must match exactly (case-sensitive). Missing or blank returns
        400, and so does a value longer than 50 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: A
    ScheduleExportGrade:
      name: grade
      in: query
      required: true
      description: |
        Required. The class's grade exactly as `GET /api/admin/schedule/classes` returns it
        (case-sensitive); surrounding spaces are ignored. Missing, blank or longer than 50
        characters returns 400.
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: G1
    ScheduleExportSection:
      name: section
      in: query
      required: true
      description: Required. The class's section; same rules as `grade`.
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: A
    BannerIdQuery:
      name: id
      in: query
      required: true
      description: Banner id. Missing, zero or not an integer returns 400; an id with no banner returns 404.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 5
    AdmsSerial:
      name: SN
      in: query
      required: false
      description: Device serial number. Logged only; the server answers `OK` with or without it.
      schema:
        type: string
      example: TEST-SN-0001
    AdmsOptions:
      name: options
      in: query
      required: false
      description: Sent by the device on boot (for example `all`). Logged only.
      schema:
        type: string
      example: all
    AdmsTable:
      name: table
      in: query
      required: false
      description: |
        The kind of data in the body. Only `ATTLOG` (attendance punches) is processed; any other
        value, or none, is acknowledged with `OK` without reading the body. Other ADMS query
        parameters (`Stamp`, `c`, ...) are accepted and ignored.
      schema:
        type: string
      example: ATTLOG
  schemas:
    RFIDTagConflictResponse:
      type: object
      description: The error body of the rfid_tag 409 on `createStudent` and `updateStudent`; other errors use ErrorResponse.
      properties:
        status:
          type: string
          enum:
            - error
        message:
          type: string
          enum:
            - rfid_tag is already used by another student
        suggested_rfid_tag:
          type: string
          nullable: true
          pattern: ^[1-9][0-9]{0,13}$
          description: |
            The first number above the requested one that no student has, with at most 14 digits.
            A hint, not a reservation. Null when there is none (the requested number is the
            largest 14-digit one or every number above it is taken) or when the requested value
            is not a number.
      required:
        - status
        - message
        - suggested_rfid_tag
      example:
        status: error
        message: rfid_tag is already used by another student
        suggested_rfid_tag: '34'
    ErrorResponse:
      type: object
      description: |
        The body of every JSON error. `message` is human-readable (English, except admin login,
        which answers in Arabic) and may change; branch on the HTTP status code.
      properties:
        status:
          type: string
          enum:
            - error
        message:
          type: string
      required:
        - status
        - message
      example:
        status: error
        message: Invalid or expired token
    MessageResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        message:
          type: string
      required:
        - status
        - message
      example:
        status: success
        message: Setting saved
    AdminLoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
      description: A wrong or missing username or password returns 401, not 400.
      example:
        username: admin
        password: example-password
    AdminLoginResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: object
          properties:
            token:
              type: string
              description: |
                Admin JWT (role `admin`), valid for 7 days. Send it as
                `Authorization: Bearer <token>`.
          required:
            - token
      required:
        - status
        - data
      example:
        status: success
        data:
          token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.EXAMPLE-ADMIN-PAYLOAD.EXAMPLE-SIGNATURE
    MobileLoginRequest:
      type: object
      properties:
        phone:
          type: string
          description: |
            The parent's Iraqi mobile number in any accepted format: `07XXXXXXXXX`,
            `+9647XXXXXXXXX`, `009647XXXXXXXXX` or `9647XXXXXXXXX` (a 0 after the country code is
            tolerated), with spaces, dashes, dots, parentheses and Arabic-Indic or Persian digits.
            All formats are the same number and share one rate-limit count. Anything else gets the
            same 401 as an unregistered number.
        pin:
          type: string
          maxLength: 72
          description: |
            The parent's credential, as a string, compared exactly: never trimmed or changed. Login
            accepts any format: new credentials are 16 to 72 ASCII characters with letters, digits
            and symbols, but credentials set before that rule (4 or 6 digits) keep working, so
            don't check the format in the app.
        fcm_token:
          type: string
          description: |
            Optional, kept for compatibility: a valid FCM registration token here is registered
            exactly as `PUT /api/mobile/device-token` would (an invalid one is ignored and the
            login still succeeds), so while the parent has push notifications turned off it is not
            stored. Use `PUT` and `DELETE /api/mobile/device-token` for refresh and logout; they
            are the contract.
      required:
        - phone
        - pin
      example:
        phone: '+9647000000101'
        pin: Kq7#vR2m!Tx9pW4z
        fcm_token: fcm-example-registration-token
    DeviceTokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 1024
          pattern: ^[A-Za-z0-9:_.-]+$
          description: The FCM registration token of this phone, from `FirebaseMessaging.instance.getToken()`.
      required:
        - token
      example:
        token: example-fcm-registration-token-0001
    DeviceTokenRegisterResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        message:
          type: string
          enum:
            - Device token registered
            - Push notifications are turned off for this account; device token not registered
        registered:
          type: boolean
          description: |
            Whether the token is now stored for this parent. `false` only while the parent has
            push notifications turned off.
      required:
        - status
        - message
        - registered
      example:
        status: success
        message: Device token registered
        registered: true
    NotificationSettings:
      type: object
      properties:
        push_enabled:
          type: boolean
          description: |
            Whether push notifications reach the parent's phones. New and existing parents start
            with `true`. Notifications are written to the parent's list either way.
      required:
        - push_enabled
      example:
        push_enabled: false
    NotificationSettingsResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          $ref: '#/components/schemas/NotificationSettings'
      required:
        - status
        - data
      example:
        status: success
        data:
          push_enabled: true
    AccountDeleteRequest:
      type: object
      properties:
        pin:
          type: string
          minLength: 1
          maxLength: 72
          description: |
            The parent's current credential, exactly as at login (never trimmed). As at login,
            don't check its format in the app: credentials set before the 16-character rule (4 or
            6 digits) still work.
      required:
        - pin
      example:
        pin: Kq7#vR2m!Tx9pW4z
    ParentProfile:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string
        phone:
          type: string
          pattern: ^\+9647[0-9]{9}$
          description: The registered number in canonical form.
      required:
        - id
        - name
        - phone
      example:
        id: 7
        name: Omar Example
        phone: '+9647000000101'
    MobileLoginResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: object
          properties:
            token:
              type: string
              description: |
                Parent JWT (role `parent`), valid for 30 days. Send it as
                `Authorization: Bearer <token>`. Treat it as opaque; when a request returns 401,
                ask the parent to log in again.
            parent:
              $ref: '#/components/schemas/ParentProfile'
          required:
            - token
            - parent
      required:
        - status
        - data
      example:
        status: success
        data:
          token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.EXAMPLE-PARENT-PAYLOAD.EXAMPLE-SIGNATURE
          parent:
            id: 7
            name: Omar Example
            phone: '+9647000000101'
    DashboardStats:
      type: object
      properties:
        total_students:
          type: integer
          format: int64
          minimum: 0
          description: Active students.
        total_parents:
          type: integer
          format: int64
          minimum: 0
          description: All parent accounts, including parents with no active student.
        present_today:
          type: integer
          format: int64
          minimum: 0
        excused_today:
          type: integer
          format: int64
          minimum: 0
        absent_today:
          type: integer
          format: int64
          minimum: 0
      required:
        - total_students
        - total_parents
        - present_today
        - excused_today
        - absent_today
      example:
        total_students: 150
        total_parents: 80
        present_today: 120
        excused_today: 10
        absent_today: 20
    DayType:
      type: string
      enum:
        - school
        - weekend
        - holiday
        - pause
      description: |
        What the day is, in this precedence: `weekend` (Friday or Saturday), `pause` (covered by
        a pause), `holiday` (covered by a holiday), otherwise `school`. Only a `school` day has
        attendance.
      example: school
    DashboardResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        date:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: Today in Asia/Baghdad.
        day_type:
          $ref: '#/components/schemas/DayType'
        day_title:
          type: string
          nullable: true
          description: The closure's title on a `holiday` or `pause` day; null on a school day or a weekend.
        day_notes:
          type: string
          nullable: true
          description: The closure's notes on a `holiday` or `pause` day, when it has any; otherwise null.
        data:
          $ref: '#/components/schemas/DashboardStats'
      required:
        - status
        - date
        - day_type
        - day_title
        - day_notes
        - data
      example:
        status: success
        date: '2026-09-21'
        day_type: school
        day_title: null
        day_notes: null
        data:
          total_students: 150
          total_parents: 80
          present_today: 120
          excused_today: 10
          absent_today: 20
    Student:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string
        parent_name:
          type: string
          description: |
            Empty string when no parent is linked, for example after the parent deleted the
            account in the app. Editing such a student needs the parent fields again, which links
            it (a number that is not registered also needs `parent_pin`).
        parent_phone:
          type: string
          pattern: ^(\+9647[0-9]{9})?$
          description: Canonical `+9647XXXXXXXXX`; empty string when no parent is linked.
        rfid_tag:
          type: string
          description: |
            The User ID the student is enrolled under on the ZKTeco device: 1 to 14 digits for
            every student created or changed since 1.18.0. A student created earlier without one
            may still have a placeholder `admin-<number>`, which no device punch can match.
        grade:
          type: string
          nullable: true
        section:
          type: string
          nullable: true
      required:
        - id
        - name
        - parent_name
        - parent_phone
        - rfid_tag
        - grade
        - section
      example:
        id: 42
        name: Sara Example
        parent_name: Omar Example
        parent_phone: '+9647000000101'
        rfid_tag: '1001'
        grade: G3
        section: A
    StudentCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Required and not blank (400). Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        parent_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Required and not blank (400). For a phone number that is already registered, it replaces that parent's name. Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        parent_phone:
          type: string
          minLength: 1
          maxLength: 20
          description: |
            Required (400). An Iraqi mobile number in any format the parent login accepts; it is
            stored as `+9647XXXXXXXXX`, and anything else is 400. Links the student to the parent
            with this number, creating the parent when the number is new.
        parent_pin:
          type: string
          minLength: 16
          maxLength: 72
          pattern: ^[\x21-\x7E]{16,72}$
          description: |
            The parent's login credential (the parent types it into the app as `pin`).
            **Required when `parent_phone` is not registered yet** (a new parent): missing, empty
            or only spaces returns 400. When set it must be **16 to 72 characters of printable
            ASCII** (`!` to `~`: no spaces, no other characters) with **at least one letter, one
            digit and one symbol** (a symbol is any of those characters that is neither a letter
            nor a digit); anything else returns 400. 72 is the bcrypt limit. The admin dashboard
            generates it with a secure random source; the server never does, stores only a hash
            and can never return it. For an already registered number it is optional: a value
            replaces the current one and signs the parent out of every device (their tokens get
            401 and their registered push devices are removed); empty or omitted keeps both.
        rfid_tag:
          type: string
          minLength: 1
          maxLength: 14
          pattern: ^[1-9][0-9]{2,13}$
          description: |
            Required. The student's user ID on the ZKTeco device (the PIN the device sends with
            each punch), so it must be exactly the number enrolled there: ASCII digits only, 1 to
            14 of them, not starting with 0. Surrounding spaces are removed first. Missing, null,
            empty or blank returns 400 `rfid_tag is required`; anything else that breaks the rule
            (Arabic-Indic or Persian digits, a leading 0, a letter, a space inside, more than 14
            digits) returns 400 with the format message, and over 50 characters returns 400
            naming the limit. 1 to 99 is the staff range (teachers): a student tag must be 100 or
            more, otherwise 400 `rfid_tag 1 to 99 is reserved for staff on the device; student IDs
            start at 100`. Must be unique: another student's tag (inactive students included)
            returns 409 with a suggested free number (always 100 or more).
        grade:
          type: string
          nullable: true
          maxLength: 50
          description: Surrounding spaces are removed before it is stored (the weekly schedule matches it exactly). Longer values return 400 naming the field and the limit.
        section:
          type: string
          nullable: true
          maxLength: 50
          description: Surrounding spaces are removed before it is stored (the weekly schedule matches it exactly). Longer values return 400 naming the field and the limit.
      required:
        - name
        - parent_name
        - parent_phone
        - rfid_tag
      example:
        name: Sara Example
        parent_name: Omar Example
        parent_phone: '+9647000000101'
        parent_pin: Kq7#vR2m!Tx9pW4z
        rfid_tag: '1001'
        grade: G3
        section: A
    StudentUpdateRequest:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          description: Required (400 when missing or 0). An id with no student returns 404.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Required and not blank (400). Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        parent_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Required and not blank (400). Replaces the linked parent's name. Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        parent_phone:
          type: string
          minLength: 1
          maxLength: 20
          description: |
            Required (400), an Iraqi mobile number in any format the parent login accepts (400
            otherwise). The student is re-linked to the parent with this number; a number that is
            not registered yet creates a new parent, which needs `parent_pin`.
        parent_pin:
          type: string
          minLength: 16
          maxLength: 72
          pattern: ^[\x21-\x7E]{16,72}$
          description: |
            **Required when `parent_phone` is not registered yet** (missing, empty or only spaces
            returns 400); the dashboard generates it, the server never does and never returns it.
            When set it must be 16 to 72 characters of printable ASCII (no spaces) with at least
            one letter, one digit and one symbol (400 otherwise). For a registered number, a value
            replaces the current one and signs the parent out of every device (tokens get 401,
            registered push devices are removed); empty or omitted keeps it.
        rfid_tag:
          type: string
          description: |
            The student's user ID on the ZKTeco device. Surrounding spaces are removed first.
            Omitted, null, empty or blank keeps the stored tag. The value already stored for this
            student is accepted unchanged even if it breaks the rule below (tags from before 1.18.0,
            such as `admin-<number>` placeholders), so a form that resends every field keeps
            working. Any other value must be ASCII digits only, 1 to 14 of them, not starting with
            0 (400 with the format message; over 50 characters returns 400 naming the limit).
            Another student's tag returns 409 with a suggested free number.
        grade:
          type: string
          nullable: true
          maxLength: 50
          description: Omitted or null keeps the stored value. Otherwise surrounding spaces are removed before it is stored (the weekly schedule matches it exactly). Longer values return 400 naming the field and the limit.
        section:
          type: string
          nullable: true
          maxLength: 50
          description: Omitted or null keeps the stored value. Otherwise surrounding spaces are removed before it is stored (the weekly schedule matches it exactly). Longer values return 400 naming the field and the limit.
      required:
        - id
        - name
        - parent_name
        - parent_phone
      example:
        id: 42
        name: Sara Example
        parent_name: Omar Example
        parent_phone: '+9647000000101'
        grade: G4
    StudentListResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Student'
      required:
        - status
        - data
      example:
        status: success
        data:
          - id: 42
            name: Sara Example
            parent_name: Omar Example
            parent_phone: '+9647000000101'
            rfid_tag: '1001'
            grade: G3
            section: A
    StudentCreatedResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        message:
          type: string
        data:
          $ref: '#/components/schemas/Student'
      required:
        - status
        - message
        - data
      example:
        status: success
        message: Student created
        data:
          id: 42
          name: Sara Example
          parent_name: Omar Example
          parent_phone: '+9647000000101'
          rfid_tag: '1001'
          grade: G3
          section: A
    DailyAttendanceDTO:
      type: object
      description: One student's attendance for one day, as the parent's today view returns it. The admin daily report returns AdminDailyAttendanceItem, which has the same fields and more.
      properties:
        student_id:
          type: integer
          format: int32
          minimum: 1
        full_name:
          type: string
        status:
          type: string
          enum:
            - Present
            - Excused
            - Absent
          description: |
            `Present`: at least one punch in the check-in window (06:30–09:30) or the check-out
            window (11:30–13:30). `Excused`: no such punch and a leave recorded for the day.
            `Absent`: neither, which includes a student who has not arrived yet today.
        check_in_time:
          type: string
          nullable: true
          pattern: ^(0[1-9]|1[0-2]):[0-5][0-9] (AM|PM)$
          description: Earliest punch in the check-in window (06:30–09:30), Asia/Baghdad; null when there is none.
        check_out_time:
          type: string
          nullable: true
          pattern: ^(0[1-9]|1[0-2]):[0-5][0-9] (AM|PM)$
          description: Earliest punch in the check-out window (11:30–13:30), Asia/Baghdad; null when there is none.
      required:
        - student_id
        - full_name
        - status
        - check_in_time
        - check_out_time
      example:
        student_id: 42
        full_name: Sara Example
        status: Present
        check_in_time: 07:15 AM
        check_out_time: null
    DailyAttendanceResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        date:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        day_type:
          $ref: '#/components/schemas/DayType'
        day_title:
          type: string
          nullable: true
          description: The closure's title on a `holiday` or `pause` day; null on a school day or a weekend.
        day_notes:
          type: string
          nullable: true
          description: The closure's notes on a `holiday` or `pause` day, when it has any; otherwise null.
        data:
          type: array
          description: Empty when `day_type` is not `school`.
          items:
            $ref: '#/components/schemas/DailyAttendanceDTO'
      required:
        - status
        - date
        - day_type
        - day_title
        - day_notes
        - data
      example:
        status: success
        date: '2026-09-21'
        day_type: school
        day_title: null
        day_notes: null
        data:
          - student_id: 42
            full_name: Sara Example
            status: Present
            check_in_time: 07:15 AM
            check_out_time: 12:30 PM
          - student_id: 43
            full_name: Yousef Example
            status: Absent
            check_in_time: null
            check_out_time: null
    AdminDailyAttendanceItem:
      type: object
      description: |
        One student's attendance for one day in the admin daily report: the fields of
        DailyAttendanceDTO (same meaning), plus where the check-in and check-out came from and the
        student's manual entries that day. A manual entry counts exactly like a device punch.
      properties:
        student_id:
          type: integer
          format: int32
          minimum: 1
        full_name:
          type: string
        status:
          type: string
          enum:
            - Present
            - Excused
            - Absent
          description: As in DailyAttendanceDTO. A manual check-out alone also makes the student `Present`.
        check_in_time:
          type: string
          nullable: true
          pattern: ^(0[1-9]|1[0-2]):[0-5][0-9] (AM|PM)$
          description: Earliest punch in the check-in window (06:30–09:30), device or manual; null when there is none.
        check_out_time:
          type: string
          nullable: true
          pattern: ^(0[1-9]|1[0-2]):[0-5][0-9] (AM|PM)$
          description: Earliest punch in the check-out window (11:30–13:30), device or manual; null when there is none.
        check_in_source:
          type: string
          nullable: true
          enum:
            - device
            - manual
            - null
          description: Where the punch shown as `check_in_time` came from; null when there is none. Mark `manual` in the report.
        check_out_source:
          type: string
          nullable: true
          enum:
            - device
            - manual
            - null
          description: Where the punch shown as `check_out_time` came from; null when there is none.
        manual_punches:
          type: array
          description: |
            The student's manual entries on this date, oldest first; empty when there are none. Show
            the delete button only for these. An entry can be listed while `check_in_source` is
            `device`, when a device punch earlier in the same window arrived after it.
          items:
            $ref: '#/components/schemas/ManualPunch'
      required:
        - student_id
        - full_name
        - status
        - check_in_time
        - check_out_time
        - check_in_source
        - check_out_source
        - manual_punches
      example:
        student_id: 42
        full_name: Sara Example
        status: Present
        check_in_time: 08:00 AM
        check_out_time: null
        check_in_source: manual
        check_out_source: null
        manual_punches:
          - id: 90412
            type: in
            time: '08:00:00'
            note: البصمة لم تعمل
    ManualPunch:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Pass it to `deleteManualAttendance`.
        type:
          type: string
          enum:
            - in
            - out
        time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$
          description: The recorded time, 24-hour `HH:MM:SS`, Asia/Baghdad.
        note:
          type: string
          nullable: true
          description: The admin's note, or null.
      required:
        - id
        - type
        - time
        - note
      example:
        id: 90412
        type: in
        time: '08:00:00'
        note: البصمة لم تعمل
    AdminDailyAttendanceResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        date:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        day_type:
          $ref: '#/components/schemas/DayType'
        day_title:
          type: string
          nullable: true
          description: The closure's title on a `holiday` or `pause` day; null on a school day or a weekend.
        day_notes:
          type: string
          nullable: true
          description: The closure's notes on a `holiday` or `pause` day, when it has any; otherwise null.
        data:
          type: array
          description: Empty when `day_type` is not `school`.
          items:
            $ref: '#/components/schemas/AdminDailyAttendanceItem'
      required:
        - status
        - date
        - day_type
        - day_title
        - day_notes
        - data
      example:
        status: success
        date: '2026-09-21'
        day_type: school
        day_title: null
        day_notes: null
        data:
          - student_id: 42
            full_name: Sara Example
            status: Present
            check_in_time: 08:00 AM
            check_out_time: null
            check_in_source: manual
            check_out_source: null
            manual_punches:
              - id: 90412
                type: in
                time: '08:00:00'
                note: البصمة لم تعمل
    ManualAttendanceRequest:
      type: object
      description: |
        A punch the admin enters for a student whose fingerprint failed. It is stored as a normal
        punch, so every report, the parent app and the noon absence job treat it exactly like a
        device punch.
      properties:
        student_id:
          type: integer
          format: int32
          minimum: 1
          description: Required, positive (400). An unknown or inactive student returns 404.
        date:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: |
            Optional, default today (Asia/Baghdad). Only today or yesterday (400 otherwise), and
            only a school day (400 on a weekend, holiday or pause) on which the student already
            existed (400 for a date before the student was added).
        type:
          type: string
          enum:
            - in
            - out
          description: Required. `in` is a check-in, `out` a check-out.
        time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
          description: |
            Optional, 24-hour `HH:MM` or `HH:MM:SS`, Asia/Baghdad. Default `08:00` for `in` and
            `13:00` for `out`. It must lie in the type's window: check-in 06:30:00 to 09:30:59,
            check-out 11:30:00 to 13:30:59 (400 otherwise). For today it must not be later than
            now (400).
        notify:
          type: boolean
          default: true
          description: |
            Optional. With `true` the parent gets the normal check-in or check-out notification
            with the recorded time (none when the student has no parent). Anything but `true`,
            `false` or null returns 400.
        note:
          type: string
          nullable: true
          maxLength: 200
          description: |
            Optional reason, shown in the daily report; surrounding spaces are removed and blank
            means none; at most 200 characters (longer, not a string, NUL or invalid UTF-8 returns
            400). Never sent to the parent.
        dry_run:
          type: boolean
          default: false
          description: |
            Optional. With `true` everything is checked, the existing punch included (409), but
            nothing is written or sent; use it for the confirmation dialog. Same type rule as `notify`.
      required:
        - student_id
        - type
      example:
        student_id: 42
        date: '2026-10-13'
        type: in
        time: '08:00'
        notify: true
        note: البصمة لم تعمل
        dry_run: true
    ManualAttendanceItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: The new entry's id (use it to delete); null for a dry run.
        student_id:
          type: integer
          format: int32
          minimum: 1
        student_name:
          type: string
          description: Show it in the confirmation, so the admin sees who is marked and notified.
        grade:
          type: string
          nullable: true
        section:
          type: string
          nullable: true
        date:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        type:
          type: string
          enum:
            - in
            - out
        time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$
          description: The recorded time, 24-hour `HH:MM:SS`.
        source:
          type: string
          enum:
            - manual
        note:
          type: string
          nullable: true
        notified:
          type: boolean
          description: True when the parent's notification was stored and pushed (for a dry run, would be).
        dry_run:
          type: boolean
      required:
        - id
        - student_id
        - student_name
        - grade
        - section
        - date
        - type
        - time
        - source
        - note
        - notified
        - dry_run
      example:
        id: null
        student_id: 42
        student_name: Sara Example
        grade: G3
        section: A
        date: '2026-10-13'
        type: in
        time: '08:00:00'
        source: manual
        note: البصمة لم تعمل
        notified: true
        dry_run: true
