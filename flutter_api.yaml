                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Banner deleted
        '400':
          $ref: '#/components/responses/BannerIdBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/BannerNotFound'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/banners/image:
    get:
      tags:
        - Admin Dashboard
      operationId: getAdminBannerImage
      summary: Preview a banner's picture
      description: |
        The uploaded picture of any banner, active or not, exactly as uploaded. Needs the admin
        token (send the `Authorization` header with the image request). Banners without an
        uploaded picture return 404; their picture is at their stored `image_url`.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/BannerIdQuery'
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a copy you already have; 304 when it is still current.
          schema:
            type: string
          example: '"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"'
      responses:
        '200':
          description: The picture.
          headers:
            ETag:
              $ref: '#/components/headers/BannerETag'
            Cache-Control:
              $ref: '#/components/headers/AdminImageCacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified; the copy whose `ETag` was sent in `If-None-Match` is current. No body.
          headers:
            ETag:
              $ref: '#/components/headers/BannerETag'
            Cache-Control:
              $ref: '#/components/headers/AdminImageCacheControl'
        '400':
          $ref: '#/components/responses/BannerIdBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: No banner with this id has an uploaded picture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Banner image not found
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/devices:
    get:
      tags:
        - Admin Dashboard
      operationId: listDevices
      summary: All registered devices
      description: Every device, active or not, ordered by `location_name`.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: Devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Admin Dashboard
      operationId: createDevice
      summary: Register a device
      description: A device registered without `is_active` is active.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
      responses:
        '200':
          description: Device registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Device added successfully
        '400':
          description: Malformed JSON, a missing `serial_number`, or a field longer than its `maxLength`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  summary: serial_number missing
                  value:
                    status: error
                    message: Invalid payload or missing SN
                tooLong:
                  summary: A field longer than its limit
                  value:
                    status: error
                    message: location_name must be at most 50 characters
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '409':
          description: A device with this serial number already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Device SN already exists
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Admin Dashboard
      operationId: updateDevice
      summary: Update a device's location or active flag
      description: |
        Changes only the fields sent; an omitted `location_name` or `is_active` keeps its stored
        value. Send at least one of them.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
      responses:
        '200':
          description: Device updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Device updated successfully
        '400':
          description: Malformed JSON, a missing `serial_number`, neither `location_name` nor `is_active` sent, or a field longer than its `maxLength`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                nothingToChange:
                  summary: Neither field sent
                  value:
                    status: error
                    message: location_name or is_active is required
                missing:
                  summary: serial_number missing
                  value:
                    status: error
                    message: Invalid payload
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: No device has this serial number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Device not found
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Admin Dashboard
      operationId: disableDevice
      summary: Disable a device
      description: |
        Sets `is_active = false`; the device and its attendance history are kept. Answers 200
        even when no device has this serial number.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/DeviceSnQuery'
      responses:
        '200':
          description: Device disabled (or no such device).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Device disabled logically
        '400':
          description: '`sn` missing or empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Missing device SN
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    ParentJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Parent token from `POST /api/mobile/login` (role `parent`, valid 30 days).
    AdminJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin token from `POST /api/admin/login` (role `admin`, valid 7 days).
    DeviceSerial:
      type: apiKey
      in: query
      name: SN
      description: Serial number of a device registered with `POST /api/admin/devices`; it is the device's only credential.
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
      example: 30
    BannerETag:
      description: Strong validator of the picture (SHA-256 of its bytes, in quotes). Send it back in `If-None-Match` to get 304 while the picture is unchanged.
      schema:
        type: string
        pattern: ^"[0-9a-f]{64}"$
      example: '"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"'
    NoSniff:
      description: Always `nosniff`; the picture is only ever its declared type.
      schema:
        type: string
        enum:
          - nosniff
      example: nosniff
    PublicImageCacheControl:
      description: The picture may be reused for 5 minutes, then revalidated with `If-None-Match`.
      schema:
        type: string
        enum:
          - public, max-age=300
      example: public, max-age=300
    AdminImageCacheControl:
      description: The dashboard revalidates the picture on every use (cheap with `If-None-Match`).
      schema:
        type: string
        enum:
          - private, no-cache
      example: private, no-cache
  parameters:
    Date:
      name: date
      in: query
      required: false
      description: |
        Calendar day, `YYYY-MM-DD`, a real date with a year from 2000 to 2100. Defaults to today
        in Asia/Baghdad. Any other value returns 400.
      schema:
        type: string
        format: date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      example: '2026-09-21'
    Month:
      name: month
      in: query
      required: false
      description: |
        Month, `YYYY-MM`, with a year from 2000 to 2100. Defaults to the current month in
        Asia/Baghdad. Any other value returns 400.
      schema:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      example: 2026-09
    Before:
      name: before
      in: query
      required: false
      description: |
        Cursor: return only notifications with an id lower than this. Pass the `next_before` of
        the previous page. Omit it for the newest page. Not a positive integer: 400.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1402
    NotificationIdQuery:
      name: id
      in: query
      required: true
      description: Notification id from the list. Missing, zero or not an integer returns 400.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1502
    StudentIdQuery:
      name: id
      in: query
      required: true
      description: Student id. Missing, zero or not an integer returns 400; an id with no student returns 404.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 42
    DeviceSnQuery:
      name: sn
      in: query
      required: true
      description: Serial number of the device to disable. Missing or empty returns 400.
      schema:
        type: string
        minLength: 1
      example: TEST-SN-0001
    ScheduleGrade:
      name: grade
      in: query
      required: true
      description: |
        The class's grade, as stored on its students (`Student.grade`). Surrounding spaces are
        ignored; otherwise it must match exactly (case-sensitive). Missing or blank returns 400,
        and so does a value longer than 50 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: G3
    ScheduleSection:
      name: section
      in: query
      required: true
      description: |
        The class's section, as stored on its students (`Student.section`). Surrounding spaces
        are ignored; otherwise it must match exactly (case-sensitive). Missing or blank returns
        400, and so does a value longer than 50 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: A
    ScheduleGradeFilter:
      name: grade
      in: query
      required: false
      description: |
        Optional. Only classes with exactly this grade (case-sensitive); surrounding spaces are
        ignored. Present but blank returns 400, and so does a value longer than 50 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: G3
    ScheduleSectionFilter:
      name: section
      in: query
      required: false
      description: Optional. Only classes with exactly this section; same rules as `grade`.
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: A
    BannerIdQuery:
      name: id
      in: query
      required: true
      description: Banner id. Missing, zero or not an integer returns 400; an id with no banner returns 404.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 5
    AdmsSerial:
      name: SN
      in: query
      required: false
      description: Device serial number. Logged only; the server answers `OK` with or without it.
      schema:
        type: string
      example: TEST-SN-0001
    AdmsOptions:
      name: options
      in: query
      required: false
      description: Sent by the device on boot (for example `all`). Logged only.
      schema:
        type: string
      example: all
    AdmsTable:
      name: table
      in: query
      required: false
      description: |
        The kind of data in the body. Only `ATTLOG` (attendance punches) is processed; any other
        value, or none, is acknowledged with `OK` without reading the body. Other ADMS query
        parameters (`Stamp`, `c`, ...) are accepted and ignored.
      schema:
        type: string
      example: ATTLOG
  schemas:
    ErrorResponse:
      type: object
      description: |
        The body of every JSON error. `message` is human-readable (English, except admin login,
        which answers in Arabic) and may change; branch on the HTTP status code.
      properties:
        status:
          type: string
          enum:
            - error
        message:
          type: string
      required:
        - status
        - message
      example:
        status: error
        message: Invalid or expired token
    MessageResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        message:
          type: string
      required:
        - status
        - message
      example:
        status: success
        message: Setting saved
    AdminLoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
      description: A wrong or missing username or password returns 401, not 400.
      example:
        username: admin
        password: example-password
    AdminLoginResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: object
          properties:
            token:
              type: string
              description: |
                Admin JWT (role `admin`), valid for 7 days. Send it as
                `Authorization: Bearer <token>`.
          required:
            - token
      required:
        - status
        - data
      example:
        status: success
        data:
          token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.EXAMPLE-ADMIN-PAYLOAD.EXAMPLE-SIGNATURE
    MobileLoginRequest:
      type: object
      properties:
        phone:
          type: string
          description: |
            The parent's Iraqi mobile number in any accepted format: `07XXXXXXXXX`,
            `+9647XXXXXXXXX`, `009647XXXXXXXXX` or `9647XXXXXXXXX` (a 0 after the country code is
            tolerated), with spaces, dashes, dots, parentheses and Arabic-Indic or Persian digits.
            All formats are the same number and share one rate-limit count. Anything else gets the
            same 401 as an unregistered number.
        pin:
          type: string
          maxLength: 72
          description: |
            The parent's credential, as a string, compared exactly: never trimmed or changed. Login
            accepts any format: new credentials are 16 to 72 ASCII characters with letters, digits
            and symbols, but credentials set before that rule (4 or 6 digits) keep working, so
            don't check the format in the app.
        fcm_token:
          type: string
          description: |
            Optional, kept for compatibility: a valid FCM registration token here is registered
            exactly as `PUT /api/mobile/device-token` would (an invalid one is ignored and the
            login still succeeds). Use `PUT` and `DELETE /api/mobile/device-token` for refresh and
            logout; they are the contract.
      required:
        - phone
        - pin
      example:
        phone: '+9647000000101'
        pin: Kq7#vR2m!Tx9pW4z
        fcm_token: fcm-example-registration-token
    DeviceTokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 1024
          pattern: ^[A-Za-z0-9:_.-]+$
          description: The FCM registration token of this phone, from `FirebaseMessaging.instance.getToken()`.
      required:
        - token
      example:
        token: example-fcm-registration-token-0001
    ParentProfile:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string
        phone:
          type: string
          pattern: ^\+9647[0-9]{9}$
          description: The registered number in canonical form.
      required:
        - id
        - name
        - phone
      example:
        id: 7
        name: Omar Example
        phone: '+9647000000101'
    MobileLoginResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: object
          properties:
            token:
              type: string
              description: |
                Parent JWT (role `parent`), valid for 30 days. Send it as
                `Authorization: Bearer <token>`. Treat it as opaque; when a request returns 401,
                ask the parent to log in again.
            parent:
              $ref: '#/components/schemas/ParentProfile'
          required:
            - token
            - parent
      required:
        - status
        - data
      example:
        status: success
        data:
          token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.EXAMPLE-PARENT-PAYLOAD.EXAMPLE-SIGNATURE
          parent:
            id: 7
            name: Omar Example
            phone: '+9647000000101'
    DashboardStats:
      type: object
      properties:
        total_students:
          type: integer
          format: int64
          minimum: 0
          description: Active students.
        total_parents:
          type: integer
          format: int64
          minimum: 0
          description: All parent accounts, including parents with no active student.
        present_today:
          type: integer
          format: int64
          minimum: 0
        excused_today:
          type: integer
          format: int64
          minimum: 0
        absent_today:
          type: integer
          format: int64
          minimum: 0
      required:
        - total_students
        - total_parents
        - present_today
        - excused_today
        - absent_today
      example:
        total_students: 150
        total_parents: 80
        present_today: 120
        excused_today: 10
        absent_today: 20
    DashboardResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        date:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: Today in Asia/Baghdad.
        data:
          $ref: '#/components/schemas/DashboardStats'
      required:
        - status
        - date
        - data
      example:
        status: success
        date: '2026-09-21'
        data:
          total_students: 150
          total_parents: 80
          present_today: 120
          excused_today: 10
          absent_today: 20
    Student:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string
        parent_name:
          type: string
          description: Empty string when no parent is linked.
        parent_phone:
          type: string
          pattern: ^(\+9647[0-9]{9})?$
          description: Canonical `+9647XXXXXXXXX`; empty string when no parent is linked.
        rfid_tag:
          type: string
          description: |
            The User ID the student is enrolled under on the ZKTeco device. A student created
            without one gets a placeholder `admin-<number>`.
        grade:
          type: string
          nullable: true
        section:
          type: string
          nullable: true
      required:
        - id
        - name
        - parent_name
        - parent_phone
        - rfid_tag
        - grade
        - section
      example:
        id: 42
        name: Sara Example
        parent_name: Omar Example
        parent_phone: '+9647000000101'
        rfid_tag: '1001'
        grade: G3
        section: A
    StudentCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Required and not blank (400). Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        parent_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Required and not blank (400). For a phone number that is already registered, it replaces that parent's name. Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        parent_phone:
          type: string
          minLength: 1
          maxLength: 20
          description: |
            Required (400). An Iraqi mobile number in any format the parent login accepts; it is
            stored as `+9647XXXXXXXXX`, and anything else is 400. Links the student to the parent
            with this number, creating the parent when the number is new.
        parent_pin:
          type: string
          minLength: 16
          maxLength: 72
          pattern: ^[\x21-\x7E]{16,72}$
          description: |
            The parent's login credential (the parent types it into the app as `pin`).
            **Required when `parent_phone` is not registered yet** (a new parent): missing, empty
            or only spaces returns 400. When set it must be **16 to 72 characters of printable
            ASCII** (`!` to `~`: no spaces, no other characters) with **at least one letter, one
            digit and one symbol** (a symbol is any of those characters that is neither a letter
            nor a digit); anything else returns 400. 72 is the bcrypt limit. The admin dashboard
            generates it with a secure random source; the server never does, stores only a hash
            and can never return it. For an already registered number it is optional: a value
            replaces the current one and signs the parent out of every device (their tokens get
            401 and their registered push devices are removed); empty or omitted keeps both.
        rfid_tag:
          type: string
          maxLength: 50
          description: |
            Device User ID; must be unique (409 when another student has it). Empty or omitted
            stores a placeholder `admin-<number>`. Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        grade:
          type: string
          nullable: true
          maxLength: 50
          description: Surrounding spaces are removed before it is stored (the weekly schedule matches it exactly). Longer values return 400 naming the field and the limit.
        section:
          type: string
          nullable: true
          maxLength: 50
          description: Surrounding spaces are removed before it is stored (the weekly schedule matches it exactly). Longer values return 400 naming the field and the limit.
      required:
        - name
        - parent_name
        - parent_phone
      example:
        name: Sara Example
        parent_name: Omar Example
        parent_phone: '+9647000000101'
        parent_pin: Kq7#vR2m!Tx9pW4z
        rfid_tag: '1001'
        grade: G3
        section: A
    StudentUpdateRequest:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          description: Required (400 when missing or 0). An id with no student returns 404.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Required and not blank (400). Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        parent_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Required and not blank (400). Replaces the linked parent's name. Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        parent_phone:
          type: string
          minLength: 1
          maxLength: 20
          description: |
            Required (400), an Iraqi mobile number in any format the parent login accepts (400
            otherwise). The student is re-linked to the parent with this number; a number that is
            not registered yet creates a new parent, which needs `parent_pin`.
        parent_pin:
          type: string
          minLength: 16
          maxLength: 72
          pattern: ^[\x21-\x7E]{16,72}$
          description: |
            **Required when `parent_phone` is not registered yet** (missing, empty or only spaces
            returns 400); the dashboard generates it, the server never does and never returns it.
            When set it must be 16 to 72 characters of printable ASCII (no spaces) with at least
            one letter, one digit and one symbol (400 otherwise). For a registered number, a value
            replaces the current one and signs the parent out of every device (tokens get 401,
            registered push devices are removed); empty or omitted keeps it.
        rfid_tag:
          type: string
          maxLength: 50
          description: Empty or omitted keeps the stored tag. Another student's tag returns 409. Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        grade:
          type: string
          nullable: true
          maxLength: 50
          description: Omitted or null keeps the stored value. Otherwise surrounding spaces are removed before it is stored (the weekly schedule matches it exactly). Longer values return 400 naming the field and the limit.
        section:
          type: string
          nullable: true
          maxLength: 50
          description: Omitted or null keeps the stored value. Otherwise surrounding spaces are removed before it is stored (the weekly schedule matches it exactly). Longer values return 400 naming the field and the limit.
      required:
        - id
        - name
        - parent_name
        - parent_phone
      example:
        id: 42
        name: Sara Example
        parent_name: Omar Example
        parent_phone: '+9647000000101'
        grade: G4
    StudentListResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Student'
      required:
        - status
        - data
      example:
        status: success
        data:
          - id: 42
            name: Sara Example
            parent_name: Omar Example
            parent_phone: '+9647000000101'
            rfid_tag: '1001'
            grade: G3
            section: A
    StudentCreatedResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        message:
          type: string
        data:
          $ref: '#/components/schemas/Student'
      required:
        - status
        - message
        - data
      example:
        status: success
        message: Student created
        data:
          id: 42
          name: Sara Example
          parent_name: Omar Example
          parent_phone: '+9647000000101'
          rfid_tag: '1001'
          grade: G3
          section: A
    DailyAttendanceDTO:
      type: object
      description: One student's attendance for one day. Shared by the admin daily report and the parent's today view.
      properties:
        student_id:
          type: integer
          format: int32
          minimum: 1
        full_name:
          type: string
        status:
          type: string
          enum:
            - Present
            - Excused
            - Absent
          description: |
            `Present`: at least one punch in the check-in window (06:30–09:30) or the check-out
            window (11:30–13:30). `Excused`: no such punch and a leave recorded for the day.
            `Absent`: neither, which includes a student who has not arrived yet today.
        check_in_time:
          type: string
          nullable: true
          pattern: ^(0[1-9]|1[0-2]):[0-5][0-9] (AM|PM)$
          description: Earliest punch in the check-in window (06:30–09:30), Asia/Baghdad; null when there is none.
        check_out_time:
          type: string
          nullable: true
          pattern: ^(0[1-9]|1[0-2]):[0-5][0-9] (AM|PM)$
          description: Earliest punch in the check-out window (11:30–13:30), Asia/Baghdad; null when there is none.
      required:
        - student_id
        - full_name
        - status
        - check_in_time
        - check_out_time
      example:
        student_id: 42
        full_name: Sara Example
        status: Present
        check_in_time: 07:15 AM
        check_out_time: null
    DailyAttendanceResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        date:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        data:
          type: array
          items:
            $ref: '#/components/schemas/DailyAttendanceDTO'
      required:
        - status
        - date
        - data
      example:
        status: success
        date: '2026-09-21'
        data:
          - student_id: 42
            full_name: Sara Example
            status: Present
            check_in_time: 07:15 AM
            check_out_time: 12:30 PM
          - student_id: 43
            full_name: Yousef Example
            status: Absent
            check_in_time: null
            check_out_time: null
    LeavePayload:
      type: object
      properties:
        student_id:
          type: integer
          format: int32
          minimum: 1
          description: Required (400 when missing, 0 or negative). An id with no active student returns 404.
        leave_date:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: Required, `YYYY-MM-DD` with a year from 2000 to 2100 (400 otherwise).
        notes:
          type: string
          description: Internal note, never shown to parents. Omitted stores an empty note.
      required:
        - student_id
        - leave_date
      example:
        student_id: 42
        leave_date: '2026-09-22'
        notes: Doctor appointment
    LeaveResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        message:
          type: string
        data:
          type: object
          properties:
            leave_id:
              type: integer
              format: int32
              minimum: 1
              description: Re-submitting the same student and date updates `notes` and returns the same id.
          required:
            - leave_id
      required:
        - status
        - message
        - data
      example:
        status: success
        message: Leave recorded successfully
        data:
          leave_id: 311
    Device:
      type: object
      properties:
        serial_number:
          type: string
        location_name:
          type: string
          description: Empty string when not set.
        is_active:
          type: boolean
        last_sync:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$
          description: |
            When the device last reached the server, `YYYY-MM-DD HH:MM:SS` in Asia/Baghdad.
            The field is omitted (not null) until the device first connects.
      required:
        - serial_number
        - location_name
        - is_active
      example:
        serial_number: TEST-SN-0001
        location_name: Main Gate
        is_active: true
        last_sync: '2026-09-21 07:00:00'
    DeviceCreateRequest:
      type: object
      properties:
        serial_number:
          type: string
          minLength: 1
          maxLength: 50
          description: Required (400). An existing serial number returns 409. Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        location_name:
          type: string
          maxLength: 50
          default: ''
          description: Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        is_active:
          type: boolean
          default: true
          description: Omitted means true (active).
      required:
        - serial_number
      example:
        serial_number: TEST-SN-0001
        location_name: Main Gate
        is_active: true
    DeviceUpdateRequest:
      type: object
      description: |
        Changes only the fields it carries: an omitted `location_name` or `is_active` keeps its
        stored value. At least one of them is required (400 otherwise). A present empty
        `location_name` clears the location.
      properties:
        serial_number:
          type: string
          minLength: 1
          maxLength: 50
          description: Required (400). A serial number with no device returns 404.
        location_name:
          type: string
          maxLength: 50
          description: Longer values return 400 naming the field and the limit (characters, trailing spaces not counted).
        is_active:
          type: boolean
      required:
        - serial_number
      example:
        serial_number: TEST-SN-0001
        location_name: Side Gate
        is_active: true
    DeviceListResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Device'
      required:
        - status
        - data
      example:
        status: success
        data:
          - serial_number: TEST-SN-0002
            location_name: ''
            is_active: false
          - serial_number: TEST-SN-0001
            location_name: Main Gate
            is_active: true
            last_sync: '2026-09-21 07:00:00'
    HardwarePushPayload:
      type: object
      properties:
        device_sn:
          type: string
          description: Must equal the `SN` query parameter the request was authenticated with (403 otherwise).
        rfid_tag:
          type: string
          description: The student's device User ID. An unknown value is accepted and ignored.
        push_time:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$
          description: Punch time, `YYYY-MM-DD HH:MM:SS`, Asia/Baghdad (400 otherwise).
