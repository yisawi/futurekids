            section: A
            day_of_week: الأحد
            period_number: 2
            subject_name: Science
            teacher_name: ''
            subject_key: science
    AdminSchedulePeriod:
      type: object
      properties:
        day_of_week:
          type: string
          description: |
            A school day, Sunday to Thursday. Accepted: the Arabic names with or without hamza
            (`الأحد`/`الاحد`, `الإثنين`/`الاثنين`, `الثلاثاء`, `الأربعاء`/`الاربعاء`, `الخميس`) and the
            English names (`Sunday` … `Thursday`) in any case, with surrounding spaces ignored. They
            are stored and returned as `الأحد`, `الإثنين`, `الثلاثاء`, `الأربعاء`, `الخميس`. Friday,
            Saturday or anything else returns 400.
        period_number:
          type: integer
          format: int32
          minimum: 1
          maximum: 6
          description: |
            1 to 6 (400 otherwise). Each day and period pair may appear only once per request
            (400). A day that has periods must have exactly periods 1 to 5 or 1 to 6 (see
            `AdminScheduleRequest.periods`).
        subject_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Required; surrounding spaces are removed, and blank returns 400. Longer than 100 characters returns 400.
        teacher_name:
          type: string
          nullable: true
          maxLength: 100
          description: Optional. Surrounding spaces are removed; omitted, null or blank is stored as null. Longer than 100 characters returns 400.
      required:
        - day_of_week
        - period_number
        - subject_name
      example:
        day_of_week: الأحد
        period_number: 1
        subject_name: Mathematics
        teacher_name: Teacher Example
    AdminScheduleRequest:
      type: object
      properties:
        grade:
          type: string
          minLength: 1
          maxLength: 50
          description: |
            Required. Surrounding spaces are removed; otherwise stored exactly as sent (no case
            folding). Use the grade exactly as the class's students have it: the parent app shows
            the schedule to children whose grade and section are equal to these.
        section:
          type: string
          minLength: 1
          maxLength: 50
          description: Required. Same rules as `grade`.
        periods:
          type: array
          maxItems: 30
          description: |
            The class's whole schedule (at most 5 days × 6 periods = 30). **Every day that has
            periods must have exactly 5 or 6 of them, numbered 1 to 5 or 1 to 6, with no gaps and
            no repeats**; a day can be left out entirely, and different days can have 5 or 6.
            Anything else returns 400 naming the day. It replaces every stored period of this
            class, including rows entered earlier in other spellings. **An empty array clears the
            class's schedule.** Missing or null returns 400, so a client bug cannot clear a class
            by accident. A `subject_key` sent back in a period is ignored.
          items:
            $ref: '#/components/schemas/AdminSchedulePeriod'
      required:
        - grade
        - section
        - periods
      example:
        grade: G3
        section: A
        periods:
          - day_of_week: الأحد
            period_number: 1
            subject_name: الرياضيات
            teacher_name: معلم تجريبي 1
          - day_of_week: الأحد
            period_number: 2
            subject_name: العلوم
            teacher_name: null
          - day_of_week: Sunday
            period_number: 3
            subject_name: اللغة العربية
            teacher_name: معلمة تجريبية 2
          - day_of_week: الاحد
            period_number: 4
            subject_name: اللغة الإنكليزية
            teacher_name: null
          - day_of_week: الأحد
            period_number: 5
            subject_name: التربية الفنية
            teacher_name: null
    AdminScheduleEntry:
      type: object
      properties:
        day_of_week:
          type: string
          description: |
            One of `الأحد`, `الإثنين`, `الثلاثاء`, `الأربعاء`, `الخميس` for every period saved
            through `PUT /api/admin/schedule` or the Excel import. Rows entered directly in the
            database before keep their stored spelling until the class is saved once.
        period_number:
          type: integer
          format: int32
          description: |
            1 to 6 for schedules saved since API 1.13.0. Rows saved earlier keep their number
            (it can be higher) until the class is saved again.
        subject_name:
          type: string
        teacher_name:
          type: string
          nullable: true
          description: Null when not set.
        subject_key:
          $ref: '#/components/schemas/SubjectKey'
      required:
        - day_of_week
        - period_number
        - subject_name
        - teacher_name
        - subject_key
      example:
        day_of_week: الأحد
        period_number: 2
        subject_name: Science
        teacher_name: null
        subject_key: science
    AdminScheduleResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        grade:
          type: string
          description: The class, with surrounding spaces removed.
        section:
          type: string
        data:
          type: array
          description: |
            The class's periods, Sunday to Thursday, then by `period_number` (the order
            `GET /api/mobile/schedule` uses). Empty when the class has no schedule.
          items:
            $ref: '#/components/schemas/AdminScheduleEntry'
      required:
        - status
        - grade
        - section
        - data
      example:
        status: success
        grade: G3
        section: A
        data:
          - day_of_week: الأحد
            period_number: 1
            subject_name: الرياضيات
            teacher_name: معلم تجريبي 1
            subject_key: math
          - day_of_week: الأحد
            period_number: 2
            subject_name: العلوم
            teacher_name: null
            subject_key: science
          - day_of_week: الأحد
            period_number: 3
            subject_name: اللغة العربية
            teacher_name: معلمة تجريبية 2
            subject_key: arabic
          - day_of_week: الأحد
            period_number: 4
            subject_name: اللغة الإنكليزية
            teacher_name: null
            subject_key: english
          - day_of_week: الأحد
            period_number: 5
            subject_name: التربية الفنية
            teacher_name: null
            subject_key: art
    SubjectKey:
      type: string
      enum:
        - math
        - pe
        - arabic
        - english
        - islamic
        - computer
        - science
        - social
        - art
        - music
        - other
      description: |
        Read-only. The subject's family, computed by the server from `subject_name` so the app
        can pick an icon without matching Arabic spellings: `math` (رياضيات, حساب), `pe` (رياضة,
        تربية رياضية/بدنية), `arabic` (عربي, قراءة), `english` (إنكليزي/إنجليزي), `islamic`
        (إسلامية, قرآن, دينية), `computer` (حاسوب, حاسب, كمبيوتر, معلوماتية), `science` (علوم),
        `social` (اجتماعيات, جغرافية, تاريخ, وطنية), `art` (فنية, رسم), `music` (موسيقى, نشيد), and
        `other` for anything else. Hamza, ta marbuta, alef maqsura, diacritics, tatweel, case and
        extra spaces don't matter; English names (Mathematics, Science, English…) are recognized
        as whole words. Never send it: a `subject_key` in a request is ignored. New values may be
        added in a later minor version, so map unknown values to the `other` icon.
      example: math
    ScheduleClass:
      type: object
      properties:
        grade:
          type: string
        section:
          type: string
        student_count:
          type: integer
          format: int32
          minimum: 0
          description: Active students with exactly this grade and section.
        period_count:
          type: integer
          format: int32
          minimum: 0
          description: Stored periods of this class (0 when it has no schedule).
        day_count:
          type: integer
          format: int32
          minimum: 0
          description: Distinct days among the stored periods (one day stored in two spellings counts once).
      required:
        - grade
        - section
        - student_count
        - period_count
        - day_count
      example:
        grade: G3
        section: A
        student_count: 24
        period_count: 28
        day_count: 5
    ScheduleClassListResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          description: |
            Every known class: the grade and section pairs of active students (both non-blank)
            together with every class that has stored periods. Ordered by `grade`, then
            `section`, compared as plain stored strings (by Unicode code point); order them for
            display yourself.
          items:
            $ref: '#/components/schemas/ScheduleClass'
      required:
        - status
        - data
      example:
        status: success
        data:
          - grade: G3
            section: A
            student_count: 24
            period_count: 28
            day_count: 5
          - grade: G3
            section: ب
            student_count: 0
            period_count: 30
            day_count: 5
          - grade: G4
            section: A
            student_count: 21
            period_count: 0
            day_count: 0
    ScheduleImportRequest:
      type: object
      description: |
        `multipart/form-data`. Each part is sent at most once (400 otherwise); unknown parts are
        ignored.
      properties:
        file:
          type: string
          format: binary
          description: |
            Required. An Excel workbook (`.xlsx`), at most 2 MiB (2,097,152 bytes; larger returns
            413). Its bytes must be a zip that opens as a workbook and unpacks to at most 20 MiB;
            anything else (CSV, old `.xls`, text renamed to `.xlsx`, an empty file) returns 400
            whatever the file name or the part's Content-Type say. See the operation for the
            columns and rules.
        dry_run:
          type: string
          enum:
            - 'true'
            - 'false'
          default: 'false'
          description: |
            Optional, exactly `true` or `false` (anything else returns 400). With `true` the file
            is checked and the same report is returned, but nothing is saved.
      required:
        - file
      example:
        file: (binary .xlsx)
        dry_run: 'true'
    ScheduleImportClass:
      type: object
      properties:
        grade:
          type: string
        section:
          type: string
        periods:
          type: integer
          format: int32
          minimum: 5
          description: Periods stored for this class (its whole schedule after the import).
        matched_students:
          type: integer
          format: int32
          minimum: 0
          description: Active students with exactly this grade and section, who see it in the parent app.
      required:
        - grade
        - section
        - periods
        - matched_students
      example:
        grade: G3
        section: A
        periods: 28
        matched_students: 24
    ScheduleImportResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        message:
          type: string
        dry_run:
          type: boolean
          description: True when nothing was saved.
        total_periods:
          type: integer
          format: int32
          minimum: 0
        classes:
          type: array
          description: Every class in the file, ordered by `grade`, then `section` (plain strings).
          items:
            $ref: '#/components/schemas/ScheduleImportClass'
        warnings:
          type: array
          description: |
            One text per class that no active student has (`matched_students` is 0): its schedule
            is saved but no parent sees it, usually because of a typo in the grade or section.
            Show these before the admin confirms.
          items:
            type: string
      required:
        - status
        - message
        - dry_run
        - total_periods
        - classes
        - warnings
      example:
        status: success
        message: 'Dry run: the file is valid; nothing was saved'
        dry_run: true
        total_periods: 58
        classes:
          - grade: G3
            section: A
            periods: 28
            matched_students: 24
          - grade: G3
            section: ب
            periods: 30
            matched_students: 0
        warnings:
          - 'grade G3, section ب: no active student has this grade and section, parents will not see it'
    ScheduleImportError:
      type: object
      description: |
        One problem in the file. `sheet` is the worksheet's name, `row` the Excel row number (as
        Excel shows it) and `column` the column's standard header name (`المرحلة`, `الشعبة`,
        `اليوم`, `الحصة`, `المادة` or `المعلم`), whatever header the file used. The last item of a
        capped list has only `message` (for example `and 12 more problems`).
      properties:
        sheet:
          type: string
        row:
          type: integer
          format: int32
          minimum: 1
        column:
          type: string
          enum:
            - المرحلة
            - الشعبة
            - اليوم
            - الحصة
            - المادة
            - المعلم
        message:
          type: string
      required:
        - message
      example:
        sheet: Sheet1
        row: 9
        column: اليوم
        message: day must be a school day, Sunday to Thursday (Arabic or English)
    ScheduleImportErrorResponse:
      type: object
      description: |
        The error envelope, with `errors` (the one extension of it) when the problems are in the
        file's rows: at most 50 problems, then one item saying how many more there are. Other 400s
        from the import (not multipart, no file, not a workbook, no header row, too many rows or
        classes, an invalid `dry_run`) have no `errors`.
      properties:
        status:
          type: string
          enum:
            - error
        message:
          type: string
        errors:
          type: array
          maxItems: 51
          items:
            $ref: '#/components/schemas/ScheduleImportError'
      required:
        - status
        - message
      example:
        status: error
        message: The file has 2 problems; nothing was saved
        errors:
          - sheet: Sheet1
            row: 9
            column: اليوم
            message: day must be a school day, Sunday to Thursday (Arabic or English)
          - sheet: Sheet1
            row: 12
            column: الحصة
            message: grade G3, section A has periods 1, 2, 3, 4 on الإثنين; a school day must have exactly 5 or 6 periods, numbered 1 to 5 or 1 to 6
    AdminBanner:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
          nullable: true
          maxLength: 255
          description: Null when not set.
        action_link:
          type: string
          nullable: true
          maxLength: 2048
          description: Absolute `http`/`https` link opened on tap; null when not set.
        is_active:
          type: boolean
          description: Only active banners reach parents (`GET /api/mobile/banners`).
        created_at:
          type: string
          format: date-time
          nullable: true
          description: RFC 3339 in Asia/Baghdad (`+03:00`). Null only for rows entered by hand without a date.
        image_url:
          type: string
          description: |
            The same value parents receive: `/api/mobile/banners/image?id=<id>` (relative to the API
            base URL) for an uploaded picture, otherwise the URL stored for an older banner. To
            preview any banner, active or not, use `GET /api/admin/banners/image?id=<id>` with the
            admin token.
        image_content_type:
          type: string
          nullable: true
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - null
          description: Type detected from the uploaded bytes; null for a banner without an uploaded picture.
        image_size_bytes:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 2097152
          description: Size of the uploaded picture; null without one.
      required:
        - id
        - title
        - action_link
        - is_active
        - created_at
        - image_url
        - image_content_type
        - image_size_bytes
      example:
        id: 5
        title: Open day
        action_link: https://example.com/open-day
        is_active: true
        created_at: '2026-09-21T09:30:00+03:00'
        image_url: /api/mobile/banners/image?id=5
        image_content_type: image/jpeg
        image_size_bytes: 284113
    AdminBannerResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          $ref: '#/components/schemas/AdminBanner'
      required:
        - status
        - data
      example:
        status: success
        data:
          id: 5
          title: Open day
          action_link: https://example.com/open-day
          is_active: true
          created_at: '2026-09-21T09:30:00+03:00'
          image_url: /api/mobile/banners/image?id=5
          image_content_type: image/jpeg
          image_size_bytes: 284113
    AdminBannerListResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          description: Every banner, active or not, newest first (by `created_at`, then `id`). Never picture bytes.
          items:
            $ref: '#/components/schemas/AdminBanner'
      required:
        - status
        - data
      example:
        status: success
        data:
          - id: 5
            title: Open day
            action_link: null
            is_active: false
            created_at: '2026-09-21T09:30:00+03:00'
            image_url: /api/mobile/banners/image?id=5
            image_content_type: image/png
            image_size_bytes: 91230
          - id: 2
            title: null
            action_link: https://example.com/sports
            is_active: true
            created_at: '2026-01-03T10:00:00+03:00'
            image_url: https://example.com/banners/sports.jpg
            image_content_type: null
            image_size_bytes: null
    BannerCreateRequest:
      type: object
      description: |
        `multipart/form-data`. Each field is sent at most once (400 otherwise); unknown parts are
        ignored.
      properties:
        image:
          type: string
          format: binary
          description: |
            Required. The picture, at most 2 MiB (2,097,152 bytes; larger returns 413). Its type
            is detected from its bytes and must be JPEG, PNG or WebP; anything else (SVG, GIF,
            BMP, text) returns 400 whatever the file name or the part's Content-Type say. An
            empty file returns 400. Resize and compress it before uploading.
        title:
          type: string
          maxLength: 255
          description: Optional. Surrounding spaces are removed; blank stores null. Longer than 255 characters returns 400.
        action_link:
          type: string
          maxLength: 2048
          description: |
            Optional. Surrounding spaces are removed; blank stores null. Otherwise it must be an
            absolute `http` or `https` URL with a host (`javascript:`, `data:`, `intent:`,
            relative links and other schemes return 400). Longer than 2048 characters returns 400.
        is_active:
          type: string
          enum:
            - 'true'
            - 'false'
          default: 'true'
          description: Optional, exactly `true` or `false` (anything else returns 400). Defaults to `true`.
      required:
        - image
      example:
        image: (binary JPEG, PNG or WebP)
        title: Open day
        action_link: https://example.com/open-day
        is_active: 'true'
    BannerUpdateRequest:
      type: object
      description: |
        `multipart/form-data`. Every part is optional; a part that is sent replaces that value and
        an omitted part keeps it. Sending none of `image`, `title`, `action_link`, `is_active`
        returns 400. Each field is sent at most once.
      properties:
        image:
          type: string
          format: binary
          description: Replaces the stored picture. Same rules as on create.
        title:
          type: string
          maxLength: 255
          description: Same rules as on create; blank clears the title.
        action_link:
          type: string
          maxLength: 2048
          description: Same rules as on create; blank clears the link.
        is_active:
          type: string
          enum:
            - 'true'
            - 'false'
          description: '`false` hides the banner from parents without deleting it; `true` shows it again.'
      example:
        title: Open day (updated)
        is_active: 'false'
    Notification:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
        body:
          type: string
        is_read:
          type: boolean
          description: |
            False until the parent marks it read with `PUT /api/mobile/notifications/read?id=` or
            `PUT /api/mobile/notifications/read-all`. New notifications always arrive unread.
        created_at:
          type: string
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+03:00$
          description: RFC 3339 in Asia/Baghdad (always `+03:00`).
      required:
        - id
        - title
        - body
        - is_read
        - created_at
      example:
        id: 1502
        title: إشعار دخول
        body: تم تسجيل دخول الطالب Sara Example الساعة 07:15
        is_read: false
        created_at: '2026-09-21T07:15:04+03:00'
    NotificationPage:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          maxItems: 100
          description: Newest first (descending id).
          items:
            $ref: '#/components/schemas/Notification'
        has_more:
          type: boolean
          description: True when older notifications exist.
        next_before:
          type: integer
          format: int32
          nullable: true
          description: The id of the last item on this page. Pass it as `before` for the next page; null when `has_more` is false.
        unread_count:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many of the parent's notifications are unread in total, across all pages (not just
            this page). The same on every page; use it for the unread badge.
      required:
        - status
        - data
        - has_more
        - next_before
        - unread_count
      example:
        status: success
        data:
          - id: 1502
            title: إشعار دخول
            body: تم تسجيل دخول الطالب Sara Example الساعة 07:15
            is_read: false
            created_at: '2026-09-21T07:15:04+03:00'
        has_more: false
        next_before: null
        unread_count: 1
    MarkAllReadResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: object
          properties:
            updated:
              type: integer
              format: int64
              minimum: 0
              description: How many notifications changed from unread to read (0 when none were unread).
          required:
            - updated
      required:
        - status
        - data
      example:
        status: success
        data:
          updated: 3
    Banner:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
          description: Empty string when not set.
        image_url:
          type: string
          description: |
            Where to load the picture. For a picture uploaded from the admin dashboard it is a
            path **relative to the API base URL** that starts with `/`, for example
            `/api/mobile/banners/image?id=5` (`GET /api/mobile/banners/image`, no token needed).
            Banners entered before uploads existed keep the full URL the school stored.
        action_link:
          type: string
          description: Link to open on tap; empty string when not set.
      required:
        - id
        - title
        - image_url
        - action_link
      example:
        id: 3
        title: Open day
        image_url: https://example.com/banners/open-day.jpg
        action_link: ''
    BannerListResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          description: Active banners, newest first.
          items:
            $ref: '#/components/schemas/Banner'
      required:
        - status
        - data
      example:
        status: success
        data:
          - id: 3
            title: Open day
            image_url: https://example.com/banners/open-day.jpg
            action_link: ''
  responses:
    BadRequest:
      description: Malformed JSON, a missing required field, or a parameter in the wrong format. `message` names the problem.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: month must be formatted as YYYY-MM
    ParentUnauthorized:
      description: |
        No usable parent token: the `Authorization` header is missing or not `Bearer <token>`;
        the token is expired, malformed or signed with another key; it was issued before the
        parent's PIN was changed (or before session versions existed); or the parent no longer
        exists. Log in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              summary: No Authorization header
              value:
                status: error
                message: Unauthorized
            invalid:
              summary: Expired or invalid token
              value:
                status: error
                message: Invalid or expired token
    ParentForbidden:
      description: A valid token without the parent role (for example an admin token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Access denied
    AdminUnauthorized:
      description: |
        No usable admin token: missing, malformed, expired, signed with another key, issued before
        the admin password was rotated, or for an admin that no longer exists. Log in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Unauthorized
    AdminForbidden:
      description: A valid token without the admin role (for example a parent token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Forbidden
    InvalidDeviceToken:
      description: Malformed JSON, or `token` missing or not 20 to 1024 of the allowed characters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid:
              summary: Token fails validation
              value:
                status: error
                message: 'token must be 20 to 1024 characters: letters, digits, '':'', ''_'', ''.'' or ''-'''
            malformed:
              summary: Body is not valid JSON
              value:
                status: error
                message: Invalid request body
    StudentWriteBadRequest:
      description: |
        Malformed JSON; `id` (update) missing or 0; `name`, `parent_name` or `parent_phone`
        missing or blank; `parent_phone` not an Iraqi mobile number; `parent_pin` missing for a
        new parent or not 16 to 72 ASCII characters with a letter, a digit and a symbol; or a
        field longer than its `maxLength`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            pinRequired:
              summary: New parent without a PIN
              value:
                status: error
                message: parent_pin is required for a new parent (parent_phone is not registered yet)
            pinFormat:
              summary: parent_pin too short, too long, with spaces or without a letter, digit and symbol
              value:
                status: error
                message: parent_pin must be 16 to 72 characters (ASCII, no spaces) with at least one letter, one digit and one symbol
            tooLong:
              summary: A field longer than its limit
              value:
                status: error
                message: name must be at most 100 characters
            invalidPhone:
              summary: Not an Iraqi mobile number
              value:
                status: error
                message: parent_phone must be an Iraqi mobile number, for example 07XXXXXXXXX or +9647XXXXXXXXX
            missing:
              summary: Required field missing
              value:
                status: error
                message: parent_phone is required
    RFIDTagTaken:
      description: Another student already has this `rfid_tag`. Nothing was written.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: rfid_tag is already used by another student
    ScheduleBadRequest:
      description: |
        Malformed JSON (including a `period_number` that is not an integer); `grade` or `section`
        missing, blank or longer than 50 characters; `periods` missing or null, or longer than
        30; a period that breaks a rule; or a day without exactly 5 or 6 periods numbered from 1.
        Problems name the period by its 0-based index (for a day, its first period in the
        request) and the day. Nothing was changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notASchoolDay:
              summary: Friday, Saturday or an unknown day name
              value:
                status: error
                message: periods[2].day_of_week must be a school day, Sunday to Thursday (Arabic or English)
            periodNumber:
              summary: period_number outside 1 to 6
              value:
                status: error
                message: periods[0].period_number must be from 1 to 6
            dayPeriods:
              summary: A day without exactly 5 or 6 periods numbered from 1 (here 4 periods)
              value:
                status: error
                message: periods[5].day_of_week الإثنين has periods 1, 2, 3, 4; a school day must have exactly 5 or 6 periods, numbered 1 to 5 or 1 to 6
            duplicate:
              summary: The same day and period twice
              value:
                status: error
                message: periods contain day_of_week الأحد with period_number 1 more than once
            tooLong:
              summary: A field longer than its limit
              value:
                status: error
                message: periods[4].subject_name must be at most 100 characters
            tooMany:
              summary: More than 30 periods
              value:
                status: error
                message: periods must contain at most 30 entries
            missingPeriods:
              summary: periods missing or null
              value:
                status: error
                message: periods is required; send an empty array to clear the schedule
            missingClass:
              summary: grade or section missing or blank
              value:
                status: error
                message: grade is required
    ScheduleExportBadRequest:
      description: '`grade` or `section` sent but blank, or longer than 50 characters.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: grade must not be blank
    ScheduleImportBadRequest:
      description: |
        Nothing was saved. Either the request or file as a whole is wrong (no `errors`), or rows
        of the file have problems (`errors` lists them).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScheduleImportErrorResponse'
          examples:
            rows:
              summary: Problems in the file's rows
              value:
                status: error
                message: The file has 1 problem; nothing was saved
                errors:
                  - sheet: Sheet1
                    row: 7
                    column: الحصة
                    message: period must be a whole number from 1 to 6
            notWorkbook:
              summary: Not an .xlsx workbook (or empty, or unpacking to more than 20 MiB)
              value:
                status: error
                message: file must be an Excel workbook (.xlsx)
            noHeader:
              summary: No worksheet has the header row
              value:
                status: error
                message: No worksheet has the header row (المرحلة, الشعبة, اليوم, الحصة, المادة, المعلم) in its first 10 rows
            tooManyRows:
              summary: More than 2000 filled rows
              value:
                status: error
                message: The file has more than 2000 schedule rows
            tooManyClasses:
              summary: More than 100 classes
              value:
                status: error
                message: The file has 101 classes; at most 100 can be imported at once
            missingFile:
              summary: No file part
              value:
                status: error
                message: file is required
            dryRun:
              summary: dry_run other than true or false
              value:
                status: error
                message: dry_run must be "true" or "false"
    ScheduleImportTooLarge:
      description: The file is larger than 2 MiB, or the whole request is larger than 2 MiB + 64 KiB. Nothing was saved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            file:
              summary: File over 2 MiB
              value:
                status: error
                message: file must be at most 2 MiB (2097152 bytes)
            body:
              summary: Request over the limit
              value:
                status: error
                message: Request body too large
    BannerWriteBadRequest:
      description: |
        Not `multipart/form-data` or a malformed body; a field sent twice; `image` missing (create),
        empty or not a JPEG, PNG or WebP picture; `title` or `action_link` too long or not text;
        `action_link` not an absolute http/https URL; `is_active` not `true`/`false`; an update
        with no field; or an invalid `id`. Nothing was changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notAPicture:
              summary: SVG, GIF, text or anything but JPEG, PNG and WebP
              value:
                status: error
                message: image must be a JPEG, PNG or WebP picture
            missingImage:
              summary: Create without a picture
              value:
                status: error
                message: image is required
            badLink:
              summary: action_link that is not an absolute http/https URL
              value:
                status: error
                message: action_link must be an absolute http or https URL
            badIsActive:
              summary: is_active other than true or false
              value:
                status: error
                message: is_active must be "true" or "false"
            nothingToUpdate:
              summary: Update without any field
              value:
                status: error
                message: send at least one of image, title, action_link or is_active
            notMultipart:
              summary: Not multipart/form-data
              value:
                status: error
                message: Request must be multipart/form-data
    BannerTooLarge:
      description: The picture is larger than 2 MiB, or the whole request is larger than 2 MiB + 64 KiB. Nothing was changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            image:
              summary: Picture over 2 MiB
              value:
                status: error
                message: image must be at most 2 MiB (2097152 bytes)
            body:
              summary: Request over the limit
              value:
                status: error
                message: Request body too large
    BannerNotFound:
      description: No banner has this id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Banner not found
    BannerIdBadRequest:
      description: '`id` is missing, zero or not an integer.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Invalid banner ID
    TooManyLoginAttempts:
      description: Too many failed login attempts; see the operation's rate limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Too many failed login attempts. Try again later.
    PayloadTooLarge:
      description: The request body is larger than 64 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Request body too large
    HeaderTooLarge:
      description: |
        The request line and headers exceed 64 KiB (plus up to 8 KiB of read-buffer tolerance).
        Sent by the HTTP server before routing, as plain text.
      content:
        text/plain:
          schema:
            type: string
          example: 431 Request Header Fields Too Large
    InternalError:
      description: Unexpected server or database error. Details are only in the server log.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Database error
    AdmsOK:
      description: Acknowledged. The device clears what it sent.
      content:
        text/plain:
          schema:
            type: string
            enum:
              - OK
          example: OK
    AdmsRetry:
      description: |
        The database is temporarily unavailable. Nothing from this batch was stored; the device
        keeps the batch and resends it (RULES.md §5).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/plain:
          schema:
            type: string
            enum:
              - RETRY
          example: RETRY
