          type: string
        data:
          type: object
          properties:
            leave_id:
              type: integer
              format: int32
              minimum: 1
              description: Re-submitting the same student and date updates `notes` and returns the same id.
          required:
            - leave_id
      required:
        - status
        - message
        - data
      example:
        status: success
        message: Leave recorded successfully
        data:
