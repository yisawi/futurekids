    ActivityLogItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
          description: When the request finished, RFC 3339 with the `+03:00` offset.
        actor:
          type: string
          description: |
            The admin account (there is one shared account), `unknown` for a failed login, or
            `parent` for `parent.account_delete` (a parent deleted the account in the app).
        action:
          type: string
          description: |
            A stable `resource.verb` code; see `listActivityLog` for the list. Show a code the
            app does not know as it is.
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - DELETE
        path:
          type: string
          description: The request path, without the query string.
        status:
          type: integer
          format: int32
          description: The HTTP status the request was answered with (500 for a request that crashed).
        result:
          type: string
          enum:
            - success
            - rejected
            - failed
          description: '`success` for 2xx and 3xx, `rejected` for 4xx, `failed` for 5xx.'
        ip:
          type: string
          nullable: true
          description: |
            The client address, as the login rate limit sees it. Always null for
            `parent.account_delete`: the parent's address is not stored.
        target_type:
          type: string
          nullable: true
          enum:
            - student
            - teacher
            - device
            - setting
            - class
            - banner
            - broadcast
            - closure
            - date
            - null
          description: What the action was on; null when it has no target.
        target_id:
          type: string
          nullable: true
          maxLength: 64
          description: |
            The target's identifier: a student, banner, broadcast or closure id, a device serial
            number, setting keys (comma-separated), a class as `grade/section`, or a date. Never
            a name.
        detail:
          type: string
          nullable: true
          maxLength: 200
          description: |
            Identifiers and counts only, for example `date=2026-09-24`, `periods=30`,
            `audience=class recipients=24`, `kind=holiday` or `dry_run` (the request was a
            preview and changed nothing). The one exception is `parent.account_delete`: the name
            of the unlinked child (or `no linked students`), so the school knows whom to link again.
      required:
        - id
        - created_at
        - actor
        - action
        - method
        - path
        - status
        - result
        - ip
        - target_type
        - target_id
        - detail
      example:
        id: 5120
        created_at: '2026-10-13T09:15:04+03:00'
        actor: admin
        action: leave.create
        method: POST
        path: /api/admin/leaves
        status: 200
        result: success
        ip: 203.0.113.7
        target_type: student
        target_id: '42'
        detail: date=2026-10-13
    ActivityLogPage:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          maxItems: 50
          description: Newest first (descending id).
          items:
            $ref: '#/components/schemas/ActivityLogItem'
        has_more:
          type: boolean
          description: True when older entries exist.
        next_before:
          type: integer
          format: int64
          nullable: true
          description: The id of the last item on this page. Pass it as `before` for the next page; null when `has_more` is false.
      required:
        - status
        - data
        - has_more
        - next_before
      example:
        status: success
        data:
          - id: 5121
            created_at: '2026-10-13T09:16:40+03:00'
            actor: admin
            action: student.update
            method: PUT
            path: /api/admin/students
            status: 409
            result: rejected
            ip: 203.0.113.7
            target_type: student
            target_id: '42'
            detail: null
          - id: 5120
            created_at: '2026-10-13T09:15:04+03:00'
            actor: unknown
            action: login.failed
            method: POST
            path: /api/admin/login
            status: 401
            result: rejected
            ip: 198.51.100.23
            target_type: null
            target_id: null
            detail: null
        has_more: false
        next_before: null
    MarkAllReadResponse:
