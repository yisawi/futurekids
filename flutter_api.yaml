  responses:
    BadRequest:
      description: Malformed JSON, a missing required field, or a parameter in the wrong format. `message` names the problem.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: month must be formatted as YYYY-MM
    ParentUnauthorized:
      description: |
        No usable parent token: the `Authorization` header is missing or not `Bearer <token>`;
        the token is expired, malformed or signed with another key; it was issued before the
        parent's PIN was changed (or before session versions existed); or the parent no longer
        exists. Log in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              summary: No Authorization header
              value:
                status: error
                message: Unauthorized
            invalid:
              summary: Expired or invalid token
              value:
                status: error
                message: Invalid or expired token
    ParentForbidden:
      description: A valid token without the parent role (for example an admin token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Access denied
    AdminUnauthorized:
      description: |
        No usable admin token: missing, malformed, expired, signed with another key, issued before
        the admin password was rotated, or for an admin that no longer exists. Log in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Unauthorized
    AdminForbidden:
      description: A valid token without the admin role (for example a parent token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Forbidden
    InvalidDeviceToken:
      description: Malformed JSON, or `token` missing or not 20 to 1024 of the allowed characters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid:
              summary: Token fails validation
              value:
                status: error
                message: 'token must be 20 to 1024 characters: letters, digits, '':'', ''_'', ''.'' or ''-'''
            malformed:
              summary: Body is not valid JSON
              value:
                status: error
                message: Invalid request body
    NotificationSettingsBadRequest:
      description: Malformed JSON, `push_enabled` not a boolean, or `push_enabled` missing or null.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            required:
              summary: push_enabled missing or null
              value:
                status: error
                message: push_enabled is required (true or false)
            malformed:
              summary: Not valid JSON, or push_enabled is not a boolean
              value:
                status: error
                message: Invalid request body
    AccountDeleteBadRequest:
      description: |
        The account was not deleted and the session stays valid: show `message` and let the
        parent try again. Never sign the parent out on this answer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            required:
              summary: pin missing, null or empty
              value:
                status: error
                message: pin is required
            incorrectPin:
              summary: Wrong PIN (counts toward the rate limit)
              value:
                status: error
                message: Incorrect PIN
            malformed:
              summary: Not valid JSON, or pin is not a string
              value:
                status: error
                message: Invalid request body
    TeacherWriteBadRequest:
      description: |
        Malformed JSON; `id` (update) missing or not positive; a name, `phone` or `gender`
        missing or blank; `status` missing (update) or not one of the four values; `phone` not an
        Iraqi mobile number; `gender` not `male` or `female`; a field longer than its limit; or an
        `rfid_tag` that is not 1 to 99. Nothing was written.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            required:
              summary: A required field missing or blank
              value:
                status: error
                message: first_name is required
            phone:
              summary: Not an Iraqi mobile number
              value:
                status: error
                message: phone must be an Iraqi mobile number, for example 07XXXXXXXXX or +9647XXXXXXXXX
            rfid:
              summary: rfid_tag outside 1 to 99
              value:
                status: error
                message: 'rfid_tag must be the teacher''s user ID on the device: 1 to 99, digits only, not starting with 0'
    TeacherQueryBadRequest:
      description: '`status` is not one of the four values, or `id` is not a positive integer.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            status:
              summary: Unknown status
              value:
                status: error
                message: status must be active, on_leave, transferred or retired
            id:
              summary: Malformed id
              value:
                status: error
                message: id must be a positive teacher id
    TeacherNotFound:
      description: No teacher has this `id`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Teacher not found
    TeacherConflict:
      description: The `phone` or `rfid_tag` is taken by another teacher, or the `rfid_tag` by a student. Nothing was written.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            phone:
              summary: Phone of another teacher
              value:
                status: error
                message: phone is already used by another teacher
            rfidTeacher:
              summary: rfid_tag of another teacher
              value:
                status: error
                message: rfid_tag is already used by another teacher
            rfidStudent:
              summary: rfid_tag of a student
              value:
                status: error
                message: rfid_tag is already used by a student
    StudentWriteBadRequest:
      description: |
        Malformed JSON; `id` (update) missing or 0; `name`, `parent_name` or `parent_phone`
        missing or blank; `parent_phone` not an Iraqi mobile number; `parent_pin` missing for a
        new parent or not 16 to 72 ASCII characters with a letter, a digit and a symbol; a
        field longer than its limit; `rfid_tag` missing on create; or an `rfid_tag` that is not
        1 to 14 ASCII digits without a leading 0, or is under 100 (the staff range); on update
        either is accepted only when it is the student's stored tag. The other fields are checked
        first. Nothing was written.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            pinRequired:
              summary: New parent without a PIN
              value:
                status: error
                message: parent_pin is required for a new parent (parent_phone is not registered yet)
            pinFormat:
              summary: parent_pin too short, too long, with spaces or without a letter, digit and symbol
              value:
                status: error
                message: parent_pin must be 16 to 72 characters (ASCII, no spaces) with at least one letter, one digit and one symbol
            tooLong:
              summary: A field longer than its limit
              value:
                status: error
                message: name must be at most 100 characters
            invalidPhone:
              summary: Not an Iraqi mobile number
              value:
                status: error
                message: parent_phone must be an Iraqi mobile number, for example 07XXXXXXXXX or +9647XXXXXXXXX
            missing:
              summary: Required field missing
              value:
                status: error
                message: parent_phone is required
            rfidRequired:
              summary: rfid_tag missing on create
              value:
                status: error
                message: rfid_tag is required
            rfidFormat:
              summary: rfid_tag that is not the device user ID format
              value:
                status: error
                message: 'rfid_tag must be digits only (1 to 14, not starting with 0): it must equal the student''s user ID on the ZKTeco device'
            rfidStaffRange:
              summary: rfid_tag under 100 (reserved for staff)
              value:
                status: error
                message: rfid_tag 1 to 99 is reserved for staff on the device; student IDs start at 100
    RFIDTagTaken:
      description: |
        Another student (inactive students included) already has this `rfid_tag`. Nothing was
        written. `suggested_rfid_tag` is the first higher number no student has, to offer in the
        form ("الرقم 33 مسجل لطالب آخر، يمكنك استخدام 34"); it is only a hint and is not
        reserved, so another request may take it first (then this 409 comes back with the next
        one).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RFIDTagConflictResponse'
          examples:
            suggestion:
              summary: The next free number
              value:
                status: error
                message: rfid_tag is already used by another student
                suggested_rfid_tag: '34'
            noSuggestion:
              summary: No free 14-digit number above it
              value:
                status: error
                message: rfid_tag is already used by another student
                suggested_rfid_tag: null
    ScheduleBadRequest:
      description: |
        Malformed JSON (including a `period_number` that is not an integer); `grade` or `section`
        missing, blank or longer than 50 characters; `periods` missing or null, or longer than
        30; a period that breaks a rule; or a day without exactly 5 or 6 periods numbered from 1.
        Problems name the period by its 0-based index (for a day, its first period in the
        request) and the day. Nothing was changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notASchoolDay:
              summary: Friday, Saturday or an unknown day name
              value:
                status: error
                message: periods[2].day_of_week must be a school day, Sunday to Thursday (Arabic or English)
            periodNumber:
              summary: period_number outside 1 to 6
              value:
                status: error
                message: periods[0].period_number must be from 1 to 6
            dayPeriods:
              summary: A day without exactly 5 or 6 periods numbered from 1 (here 4 periods)
              value:
                status: error
                message: periods[5].day_of_week الإثنين has periods 1, 2, 3, 4; a school day must have exactly 5 or 6 periods, numbered 1 to 5 or 1 to 6
            duplicate:
              summary: The same day and period twice
              value:
                status: error
                message: periods contain day_of_week الأحد with period_number 1 more than once
            tooLong:
              summary: A field longer than its limit
              value:
                status: error
                message: periods[4].subject_name must be at most 100 characters
            tooMany:
              summary: More than 30 periods
              value:
                status: error
                message: periods must contain at most 30 entries
            missingPeriods:
              summary: periods missing or null
              value:
                status: error
                message: periods is required; send an empty array to clear the schedule
            missingClass:
              summary: grade or section missing or blank
              value:
                status: error
                message: grade is required
    ScheduleExportBadRequest:
      description: '`grade` or `section` missing or blank, or longer than 50 characters.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              summary: grade missing or blank
              value:
                status: error
                message: grade is required
            tooLong:
              summary: section longer than 50 characters
              value:
                status: error
                message: section must be at most 50 characters
    ScheduleClassNotFound:
      description: |
        No class has this grade and section: no active student has them and no period is stored
        for them (the definition of `GET /api/admin/schedule/classes`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: 'No class has this grade and section: no active student and no schedule'
    ScheduleImportBadRequest:
      description: |
        Nothing was saved. Either the request or file as a whole is wrong (no `errors`), or rows
        of the file have problems (`errors` lists them).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScheduleImportErrorResponse'
          examples:
            rows:
              summary: Problems in the file's rows
              value:
                status: error
                message: The file has 1 problem; nothing was saved
                errors:
                  - sheet: Sheet1
                    row: 7
                    column: الحصة
                    message: period must be a whole number from 1 to 6
            notWorkbook:
              summary: Not an .xlsx workbook (or empty, or unpacking to more than 20 MiB)
              value:
                status: error
                message: file must be an Excel workbook (.xlsx)
            noHeader:
              summary: No worksheet has the header row
              value:
                status: error
                message: No worksheet has the header row (المرحلة, الشعبة, اليوم, الحصة, المادة, المعلم) in its first 10 rows
            tooManyRows:
              summary: More than 2000 filled rows
              value:
                status: error
                message: The file has more than 2000 schedule rows
            tooManyClasses:
              summary: More than 100 classes
              value:
                status: error
                message: The file has 101 classes; at most 100 can be imported at once
            missingFile:
              summary: No file part
              value:
                status: error
                message: file is required
            dryRun:
              summary: dry_run other than true or false
              value:
                status: error
                message: dry_run must be "true" or "false"
            otherClass:
              summary: With the class guard, a row of another class
              value:
                status: error
                message: The file has 1 problem; nothing was saved
                errors:
                  - sheet: Sheet1
                    row: 8
                    column: الشعبة
                    message: this file is for grade G1, section A only
            guardIncomplete:
              summary: grade sent without section (or the reverse)
              value:
                status: error
                message: section is required when grade is sent
            noRowsForClass:
              summary: With the class guard, no filled row of that class
              value:
                status: error
                message: The file has no rows for grade G1, section A
    ScheduleImportTooLarge:
      description: The file is larger than 2 MiB, or the whole request is larger than 2 MiB + 64 KiB. Nothing was saved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            file:
              summary: File over 2 MiB
              value:
                status: error
                message: file must be at most 2 MiB (2097152 bytes)
            body:
              summary: Request over the limit
              value:
                status: error
                message: Request body too large
    BroadcastBadRequest:
      description: |
        Malformed JSON; `title` or `body` missing, blank, too long, not a string, or with NUL or
        invalid UTF-8; `audience` missing, of an unknown type, or with a field its type does not
        allow; a `parent_phone` that is not an Iraqi mobile number; a blank or too long `grade`
        or `section`; `dry_run` not a boolean; or no parent matches the audience. Nothing was
        written or sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            noRecipients:
              summary: No parent matches the audience
              value:
                status: error
                message: No parents match this audience
            fieldNotAllowed:
              summary: A field the audience type does not allow
              value:
                status: error
                message: audience.grade, audience.section and audience.parent_phone must not be sent when audience.type is all
            titleTooLong:
              summary: Title over 100 characters
              value:
                status: error
                message: title must be at most 100 characters
    BroadcastParentNotFound:
      description: The audience is one parent, and no parent has this phone number. Nothing was written or sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: No parent has this phone number
    BroadcastDuplicate:
      description: |
        A broadcast with the same title, body and audience was sent less than 60 seconds
        ago (usually a double tap). Nothing was written or sent. Not returned for a dry run.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: The same broadcast was sent to this audience less than a minute ago
    BroadcastCursorBadRequest:
      description: '`before` is not a positive integer.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: before must be a positive broadcast id
    HolidayBadRequest:
      description: |
        Malformed JSON; `kind` missing or not `holiday` or `pause`; `start_date` missing; a date
        that is not a real `YYYY-MM-DD` with a year from 2000 to 2100; `end_date` before
        `start_date`; a holiday longer than 60 days; a pause without `confirm: true` or starting
        before today; `title` missing, blank or longer than 80 characters; `notes` longer than
        500; a field of the wrong type, or text with NUL or invalid UTF-8. Nothing was written or
        sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            holidayTooLong:
              summary: A holiday over 60 days
              value:
                status: error
                message: a holiday can be at most 60 days; use a pause for a longer closure
            pauseNotConfirmed:
              summary: A pause without confirm
              value:
                status: error
                message: confirm must be true for a pause
            pauseInPast:
              summary: A pause starting before today
              value:
                status: error
                message: a pause cannot start in the past
    HolidayOverlap:
      description: |
        The dates share at least one day with an existing closure (an open-ended pause covers
        every day from its start). `message` names that closure. Nothing was written or sent.
        Cancel the other closure first, or choose other dates.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Overlaps closure 12 "عطلة الربيع" (2026-03-22 to 2026-03-26); cancel it first or choose other dates
    ManualAttendanceBadRequest:
      description: |
        Malformed JSON; `student_id` missing or not a positive integer; `type` missing or not
        `in` or `out`; `date` not a real `YYYY-MM-DD`, not today or yesterday, not a school day,
        or before the student was added; `time` not `HH:MM`/`HH:MM:SS`, outside the type's window,
        or later than now for today; `note` longer than 200 characters, not a string, or with NUL
        or invalid UTF-8; `notify` or `dry_run` not a boolean. Nothing was written or sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            outsideWindow:
              summary: A check-in time outside its window
              value:
                status: error
                message: time must be in the check-in window 06:30:00 to 09:30:59
            notTodayOrYesterday:
              summary: An older date
              value:
                status: error
                message: date must be today (2026-10-13) or yesterday (2026-10-12)
            notSchoolDay:
              summary: A weekend, holiday or pause
              value:
                status: error
                message: 2026-10-10 is not a school day (weekend)
    ManualAttendanceStudentNotFound:
      description: No active student has this id. Nothing was written or sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Student not found
    ManualAttendanceConflict:
      description: |
        The student already has a punch in that window on that date, from a device or entered by
        hand; `message` gives its time and source. Nothing was written or sent. To correct a
        manual entry, delete it and enter it again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Student already has a check-in at 07:45 AM on 2026-10-13 (device)
    ManualAttendanceDeleteBadRequest:
      description: '`id` missing or not a positive integer. Nothing was deleted.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: id must be a positive attendance entry id
    ManualAttendanceEntryNotFound:
      description: No punch has this id (it may have been deleted already). Nothing was deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Attendance entry not found
    ManualAttendanceDeleteConflict:
      description: |
        The punch came from a device (device punches are never deleted through the API), or it is
        a manual entry from before yesterday. Nothing was deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            devicePunch:
              summary: A device punch
              value:
                status: error
                message: Only manual entries can be deleted; this punch came from a device
            tooOld:
              summary: A manual entry from before yesterday
              value:
                status: error
                message: Only manual entries from today (2026-10-13) or yesterday (2026-10-12) can be deleted
    HolidayCancelBadRequest:
      description: |
        Malformed JSON; `id` missing or not a positive integer; `notes` longer than 500
        characters, not a string, or with NUL or invalid UTF-8; `notify` or `dry_run` not a
        boolean. Nothing was changed or sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: id must be a positive closure id
    HolidayNotFound:
      description: No closure has this id (it may have been cancelled already). Nothing was changed or sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Closure not found
    HolidayAlreadyOver:
      description: The closure ended before today. Days that have passed stay closed and cannot be cancelled. Nothing was changed or sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: This closure is already over
    ActivityLogCursorBadRequest:
      description: '`before` is not a positive integer.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: before must be a positive activity log id
    BannerWriteBadRequest:
      description: |
        Not `multipart/form-data` or a malformed body; a field sent twice; `image` missing (create),
        empty or not a JPEG, PNG or WebP picture; `title` or `action_link` too long or not text;
        `action_link` not an absolute http/https URL; `is_active` not `true`/`false`; an update
        with no field; or an invalid `id`. Nothing was changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notAPicture:
              summary: SVG, GIF, text or anything but JPEG, PNG and WebP
              value:
                status: error
                message: image must be a JPEG, PNG or WebP picture
            missingImage:
              summary: Create without a picture
              value:
                status: error
                message: image is required
            badLink:
              summary: action_link that is not an absolute http/https URL
              value:
                status: error
                message: action_link must be an absolute http or https URL
            badIsActive:
              summary: is_active other than true or false
              value:
                status: error
                message: is_active must be "true" or "false"
            nothingToUpdate:
              summary: Update without any field
              value:
                status: error
                message: send at least one of image, title, action_link or is_active
            notMultipart:
              summary: Not multipart/form-data
              value:
                status: error
                message: Request must be multipart/form-data
    BannerTooLarge:
      description: The picture is larger than 2 MiB, or the whole request is larger than 2 MiB + 64 KiB. Nothing was changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            image:
              summary: Picture over 2 MiB
              value:
                status: error
                message: image must be at most 2 MiB (2097152 bytes)
            body:
              summary: Request over the limit
              value:
                status: error
                message: Request body too large
    BannerNotFound:
      description: No banner has this id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Banner not found
    BannerIdBadRequest:
      description: '`id` is missing, zero or not an integer.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Invalid banner ID
    TooManyLoginAttempts:
      description: Too many failed login attempts; see the operation's rate limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Too many failed login attempts. Try again later.
    PayloadTooLarge:
      description: The request body is larger than 64 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Request body too large
    HeaderTooLarge:
      description: |
        The request line and headers exceed 64 KiB (plus up to 8 KiB of read-buffer tolerance).
        Sent by the HTTP server before routing, as plain text.
      content:
        text/plain:
          schema:
            type: string
          example: 431 Request Header Fields Too Large
    InternalError:
      description: Unexpected server or database error. Details are only in the server log.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Database error
    AdmsOK:
      description: Acknowledged. The device clears what it sent.
      content:
        text/plain:
          schema:
            type: string
            enum:
              - OK
          example: OK
    AdmsRetry:
      description: |
        The database is temporarily unavailable. Nothing from this batch was stored; the device
        keeps the batch and resends it (RULES.md §5).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/plain:
          schema:
            type: string
            enum:
              - RETRY
          example: RETRY
x-tagGroups:
  - name: Parent app (Flutter)
    tags:
      - Parent App
  - name: Admin dashboard
    tags:
      - Admin Dashboard
  - name: Operations
    tags:
      - System
  - name: Internal
    tags:
      - Hardware (internal)
x-transport-responses:
  '404':
    description: No route has this path (any method). Not sent for `/health` or `/iclock/*`.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
        example:
          status: error
          message: Not found
  '405':
    description: |
      The path exists but not with this method. Sent before authentication, so a request with
      the wrong method gets 405 even without a token. Not sent for `/health` or `/iclock/*`.
    headers:
      Allow:
        description: The methods the path supports.
        schema:
          type: string
        example: GET, HEAD
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
        example:
          status: error
          message: Method not allowed
