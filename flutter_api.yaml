openapi: 3.0.3
info:
  title: Future Kids Attendance System API
  version: 1.20.0
  license:
    name: Proprietary (all rights reserved)
  description: |
    Backend API for the Future Kids school attendance system. This file is the contract
    (RULES.md §4); `tests/contract` checks every operation against the running server.

    **Clients**
    - **Parent App** (Flutter): operations tagged `Parent App`. Start with `POST /api/mobile/login`.
    - **Admin Dashboard**: operations tagged `Admin Dashboard`. Start with `POST /api/admin/login`.
    - **Hardware (internal)**: called only by the school's ZKTeco attendance devices. These
      operations are marked `x-internal: true` and are not for app clients.

    **Conventions**
    - JSON responses carry `"status": "success"` or `"status": "error"`. Every JSON error is
      `{"status": "error", "message": "..."}`. Branch on the HTTP status code, not on `message`.
      The one extension: a 400 from `POST /api/admin/schedule/import` about the file's rows adds
      an `errors` array (sheet, row, column and message of each problem).
    - Authenticate with `Authorization: Bearer <token>`: the word `Bearer` exactly, one space.
      Parent tokens last 30 days and admin tokens 7 days; there is no refresh endpoint. A 401
      means "log in again"; a 403 means the token belongs to the other app (parent vs admin).
      Changing a parent's PIN, or rotating the admin password, ends every session issued before
      the change: those tokens get 401.
    - Phone numbers are Iraqi mobile numbers. The server stores and returns them only as
      `+9647XXXXXXXXX`; it accepts `07XXXXXXXXX`, `+9647…`, `009647…` or `9647…`, with spaces,
      dashes, parentheses and Arabic-Indic or Persian digits (RULES.md §4).
    - Dates and times are Asia/Baghdad (UTC+03:00, no daylight saving). Dates are `YYYY-MM-DD`,
      months `YYYY-MM`, punch times `hh:mm AM`/`hh:mm PM` (12-hour, zero-padded), and
      notification timestamps RFC 3339 with a `+03:00` offset.
    - Every date and month parameter or field accepts years 2000 to 2100 only; any other year
      returns 400.
    - **School days** are the Sunday-to-Thursday dates that no school closure (holiday or
      pause, see `createHoliday`) covers. Friday and Saturday are never school days. A day that
      is not a school day has no attendance: the daily views return empty `data` and zero
      counts with its `day_type`, closed days are left out of the monthly views, the noon
      absence notification is not sent, and punches are stored without notifications.
    - IDs are integers. JSON request bodies are limited to 64 KiB (413). Request headers are
      limited to 64 KiB plus up to 8 KiB of read-buffer tolerance; beyond that the answer is
      431 in plain text. Unknown JSON fields in a request body are ignored.

    **Responses not listed per operation** (schemas in `x-transport-responses`)
    - An unknown path returns `404` with the JSON error envelope.
    - A method a path does not support returns `405` with the JSON error envelope and an `Allow`
      header, before authentication. `/health` and `/iclock/*` keep the HTTP server's plain-text
      404 and 405 (RULES.md §5); `/api/attendance/push` answers every method like POST.
    - A request still running after 30 seconds has its connection closed without a response.
      Banner uploads (`POST`/`PUT /api/admin/banners`) get 2 minutes.
    - While the service is deploying or down, the Railway edge proxy may answer `502` or `503`
      with its own body. Treat both as "try again later".
servers:
  - url: https://futurekids-staging.up.railway.app
    description: Staging (Railway)
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Parent App
    description: |
      Used by the Flutter parent app. `POST /api/mobile/login` and `GET /api/mobile/settings`
      are public; every other parent operation needs the parent token.
  - name: Admin Dashboard
    description: Used by the school's admin dashboard. Every operation except login needs the admin token.
  - name: System
    description: Liveness check for monitoring.
  - name: Hardware (internal)
    description: |
      Called only by the ZKTeco attendance devices. **Not for app clients.** These operations
      stay in this file because it is the single contract for every route the server registers
      (RULES.md §4). To produce a copy without them, run
      `npx @redocly/cli bundle flutter -o flutter_api.yaml` (see `redocly.yaml`).
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Liveness check
      description: Reports that the process is up. It does not check the database.
      security: []
      responses:
        '200':
          description: The server is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Server is healthy and running!
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
  /api/mobile/login:
    post:
      tags:
        - Parent App
      operationId: parentLogin
      summary: Parent login (phone and PIN)
      description: |
        Returns a parent token valid for 30 days. Optionally registers this device's FCM token
        for push notifications (see `fcm_token`).

        **Rate limit:** after 5 failed attempts (wrong PIN or unregistered number) for a phone
        number within 15 minutes of that number's first attempt, every attempt for the number
        returns 429 until the window ends, even with the correct PIN. Every format of a number
        counts as the same number, and wrong PINs sent to `deleteParentAccount` count too.
        `Retry-After` gives the seconds left. A successful login clears the count. Show the
        parent a wait message and do not retry automatically.

        Each login returns a token for the parent's current session; it stops working when the
        school changes the PIN.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginRequest'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileLoginResponse'
        '400':
          description: Malformed JSON, or `phone` or `pin` missing or empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFields:
                  summary: phone or pin missing
                  value:
                    status: error
                    message: Phone and PIN are required
                malformed:
                  summary: Body is not valid JSON
                  value:
                    status: error
                    message: Invalid request
        '401':
          description: Unknown phone number or wrong PIN (the same answer for both).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Invalid phone number or PIN
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyLoginAttempts'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/settings:
    get:
      tags:
        - Parent App
      operationId: getPublicSettings
      summary: Public app settings
      description: |
        Public on purpose, so the app can load it before login. Returns only `whatsapp_number`
        and `school_name`, each only when set; internal settings are never exposed here.
      security: []
      responses:
        '200':
          description: The public settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSettingsResponse'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/students:
    get:
      tags:
        - Parent App
      operationId: listParentStudents
      summary: The parent's children
      description: Active students linked to this parent, by ascending id. Empty when there are none.
      security:
        - ParentJWT: []
      responses:
        '200':
          description: The parent's active children.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileStudentListResponse'
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/attendance/today:
    get:
      tags:
        - Parent App
      operationId: getTodayAttendance
      summary: Today's attendance for the parent's children
      description: |
        One DailyAttendanceDTO per active child for today in Asia/Baghdad (`date`), ordered by
        `student_id` ascending like the other parent lists. When today is not a school day
        (`day_type` is `weekend`, `holiday` or `pause`), `data` is empty: show the closure
        (`day_title`, `day_notes`) or the weekend instead of attendance.
      security:
        - ParentJWT: []
      responses:
        '200':
          description: Today's attendance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyAttendanceResponse'
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/attendance/summary:
    get:
      tags:
        - Parent App
      operationId: getAttendanceSummary
      summary: Monthly attendance totals per child
      description: |
        Present, Excused and Absent counts per active child over the month's school days
        (Sunday–Thursday, except days covered by a holiday or pause) up to today. Children by
        ascending id. Closed days are not counted at all.
        - **A child is counted from the day it was added** (its creation date in Asia/Baghdad,
          inclusive). Earlier days are not counted at all, even if punches or leaves exist for
          them.
        - **Today before 09:31 Asia/Baghdad** (while the check-in window is open), today is not
          counted when its status is `Absent`, because the child may simply not have arrived
          yet. A `Present` or `Excused` today is counted. From 09:31:00 today counts normally.
        - A child with no counted day in the month (added after the month, or a month with no
          school day up to today) is left out. When no child has a counted day (a future month,
          or the first days of a month that fall on Friday and Saturday), `data` is an empty
          array, not zero counts.
      security:
        - ParentJWT: []
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Totals per child.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/attendance/monthly:
    get:
      tags:
        - Parent App
      operationId: getMonthlyAttendance
      summary: Day-by-day attendance per child for a month
      description: |
        One record per school day (Sunday–Thursday, except days covered by a holiday or pause)
        of the month up to today, newest first, grouped by child in ascending id. Closed days
        have no record; draw them from `GET /api/mobile/holidays`.
        - **A child's records start on the day it was added** (its creation date in
          Asia/Baghdad, inclusive), so a month may start after its first school day. Earlier
          days have no record, even if punches or leaves exist for them.
        - **Today before 09:31 Asia/Baghdad** (while the check-in window is open), today's record
          is left out when its status is `Absent`, because the child may simply not have arrived
          yet. A `Present` or `Excused` today is included. From 09:31:00 it is included normally.
        - A child with no record in the month is left out. When no child has a record (a future
          month, a month before the children were added, or a month with no school day up to
          today), `data` is an empty array.
      security:
        - ParentJWT: []
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Records per child.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyAttendanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/holidays:
    get:
      tags:
        - Parent App
      operationId: listParentHolidays
      summary: Closed school days of a month
      description: |
        The Sunday-to-Thursday dates of the month that a holiday or pause closes, one item per
        date in date order, with the closure's title and notes, for the calendar. An open-ended
        or long closure is listed on every school weekday it covers in the month. Weekends are
        not listed: Friday and Saturday are never school days.
      security:
        - ParentJWT: []
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: The closed days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentHolidaysResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/schedule:
    get:
      tags:
        - Parent App
      operationId: getWeeklySchedule
      summary: Weekly class schedule for the parent's children
      description: |
        Ordered by child (ascending id), then school week: Sunday, Monday, Tuesday, Wednesday,
        Thursday, then Friday and Saturday, then `period_number`. `day_of_week` is returned
        exactly as stored; Arabic names (الأحد … الخميس, with or without hamza) and English
        names in any case are recognized. Unrecognized names sort after all real days,
        alphabetically. A child without a grade and section has no entries. Schedules saved with
        `PUT /api/admin/schedule` or the Excel import use only `الأحد`, `الإثنين`, `الثلاثاء`,
        `الأربعاء`, `الخميس`, and every day has exactly 5 or 6 periods (older rows may differ
        until their class is saved again). Each entry carries `subject_key` for the subject's
        icon.
      security:
        - ParentJWT: []
      responses:
        '200':
          description: Schedule entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/notifications:
    get:
      tags:
        - Parent App
      operationId: listNotifications
      summary: The parent's notification history (paginated)
      description: |
        This parent's notifications, newest first, at most 100 per page. When `has_more` is true,
        request the next (older) page with `?before=<next_before>`. History belongs to the parent
        account: it survives a change of the parent's phone number. It is stored for every
        notification even when no push could be delivered. `unread_count` is the total of unread
        notifications, for a badge.
      security:
        - ParentJWT: []
      parameters:
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: One page of notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          description: '`before` is not a positive integer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: before must be a positive notification id
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/notifications/read:
    put:
      tags:
        - Parent App
      operationId: markNotificationRead
      summary: Mark one notification as read
      description: |
        Marks the notification with `id` as read. Idempotent: marking a read notification again
        also answers 200. An id that belongs to another parent gets the same 404 as an id that
        does not exist. No request body.
      security:
        - ParentJWT: []
      parameters:
        - $ref: '#/components/parameters/NotificationIdQuery'
      responses:
        '200':
          description: The notification is read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Notification marked as read
        '400':
          description: '`id` missing, zero or not an integer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: id must be a positive notification id
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '404':
          description: This parent has no notification with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Notification not found
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/notifications/read-all:
    put:
      tags:
        - Parent App
      operationId: markAllNotificationsRead
      summary: Mark all notifications as read
      description: |
        Marks every unread notification of this parent as read and reports how many changed.
        Idempotent: a second call reports 0. Notifications that arrive afterwards are unread.
        No request body.
      security:
        - ParentJWT: []
      responses:
        '200':
          description: All of the parent's notifications are read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllReadResponse'
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/banners:
    get:
      tags:
        - Parent App
      operationId: listBanners
      summary: Active banners (the pictures on the parent home screen)
      description: Active banners, newest first, for the home-screen carousel.
      security:
        - ParentJWT: []
      responses:
        '200':
          description: Active banners.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerListResponse'
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/banners/image:
    get:
      tags:
        - Parent App
      operationId: getBannerImage
      summary: Picture of an active banner
      description: |
        The uploaded picture of an **active** banner, exactly as uploaded. **No token needed**:
        banners are broadcasts for every parent, so `Image.network(baseUrl + image_url)` works
        as is. Reached through a banner's relative `image_url`. An inactive or unknown banner, or
        one without an uploaded picture, returns 404.
      security: []
      parameters:
        - $ref: '#/components/parameters/BannerIdQuery'
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a copy you already have; 304 when it is still current.
          schema:
            type: string
          example: '"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"'
      responses:
        '200':
          description: The picture.
          headers:
            ETag:
              $ref: '#/components/headers/BannerETag'
            Cache-Control:
              $ref: '#/components/headers/PublicImageCacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified; the copy whose `ETag` was sent in `If-None-Match` is current. No body.
          headers:
            ETag:
              $ref: '#/components/headers/BannerETag'
            Cache-Control:
              $ref: '#/components/headers/PublicImageCacheControl'
        '400':
          $ref: '#/components/responses/BannerIdBadRequest'
        '404':
          description: No active banner with this id has an uploaded picture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Banner image not found
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/device-token:
    put:
      tags:
        - Parent App
      operationId: registerDeviceToken
      summary: Register or refresh this phone's push token
      description: |
        Stores this phone's FCM token for the signed-in parent. Call it after every login, at
        every app start, and whenever Firebase gives the app a new token. It is idempotent.

        Every push for any of the parent's children goes to all of the parent's registered
        phones, including children added later. A token belongs to one parent at a time: when
        another parent registers the same token (the phone changed hands), it moves to that
        parent. A parent keeps at most 10 tokens; registering an 11th removes the one seen
        least recently. A token FCM reports as no longer registered is removed automatically,
        and changing the parent's PIN removes all of the parent's tokens.

        While the parent has push notifications turned off (`updateNotificationSettings`), the
        token is **not stored**: the answer is still 200, with `registered` false, so the app
        need not treat it as an error. The token is also removed from any other parent, since
        this phone now belongs to this parent. After turning push back on, call this again.
      security:
        - ParentJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: Registered (or refreshed), or not stored because push is turned off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenRegisterResponse'
              examples:
                registered:
                  summary: Stored
                  value:
                    status: success
                    message: Device token registered
                    registered: true
                pushOff:
                  summary: Not stored, push notifications are turned off
                  value:
                    status: success
                    message: Push notifications are turned off for this account; device token not registered
                    registered: false
        '400':
          $ref: '#/components/responses/InvalidDeviceToken'
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Parent App
      operationId: removeDeviceToken
      summary: Remove this phone's push token (logout)
      description: |
        Stops pushes to this phone. Call it on logout, before discarding the parent token. The
        token travels in the JSON body so it never appears in URLs or request logs. It only
        removes the caller's own token and answers 200 whether or not the token was registered
        to this parent, so a retried logout succeeds and nothing is revealed about other
        parents.
      security:
        - ParentJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: Removed, or was not registered to this parent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Device token removed
        '400':
          $ref: '#/components/responses/InvalidDeviceToken'
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/notification-settings:
    get:
      tags:
        - Parent App
      operationId: getNotificationSettings
      summary: Read the push notification switch
      description: |
        Whether push notifications reach the parent's phones. The setting belongs to the parent
        account, so it survives logout, reinstalling the app and a new phone. It says nothing
        about the phone's own notification permission, which the app reads from the OS.
      security:
        - ParentJWT: []
      responses:
        '200':
          description: The current setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsResponse'
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Parent App
      operationId: updateNotificationSettings
      summary: Turn push notifications on or off
      description: |
        `false` stops every push to all of the parent's phones: in one step it records the
        choice and removes all of the parent's device tokens, and while it is off
        `PUT /api/mobile/device-token` (and login's `fcm_token`) stores nothing. Notifications are
        still written to the parent's list (`GET /api/mobile/notifications`) exactly as before;
        only the push stops.

        `true` records the choice but registers no phone: call `PUT /api/mobile/device-token`
        right after it.

        Sending the current value again changes nothing and answers 200.
      security:
        - ParentJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettings'
      responses:
        '200':
          description: Saved; `data` is the new setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsResponse'
        '400':
          $ref: '#/components/responses/NotificationSettingsBadRequest'
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mobile/account/delete:
    post:
      tags:
        - Parent App
      operationId: deleteParentAccount
      summary: Delete the parent account
      description: |
        Permanently deletes the signed-in parent account after checking its PIN. There is no
        undo and no restore.

        **Deleted:** the parent (name, phone number, PIN), all of the parent's device tokens and
        the parent's notification list. Every token of the account stops working: the next
        request with one gets 401.

        **Kept:** every child linked to this phone number, active or not, with its attendance,
        leaves and schedule; the children are no longer linked to any parent. The school's
        activity log lists the unlinked children by name (never the parent's name or number),
        and the school can link them again to a phone number, which creates a new account with a
        new PIN.

        **PIN check:** as at login: compared exactly, never trimmed or format-checked. A wrong PIN
        answers 400 `Incorrect PIN` and the session stays valid. Wrong PINs count toward the
        login rate limit of the parent's phone number (see `parentLogin`): after 5 failures
        within 15 minutes, login and this operation both answer 429 until the window ends.

        `POST` rather than `DELETE`, because some HTTP clients drop the body of a DELETE.
      security:
        - ParentJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
      responses:
        '200':
          description: Deleted. Clear everything stored for this account and return to login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Account deleted
        '400':
          $ref: '#/components/responses/AccountDeleteBadRequest'
        '401':
          $ref: '#/components/responses/ParentUnauthorized'
        '403':
          $ref: '#/components/responses/ParentForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyLoginAttempts'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/login:
    post:
      tags:
        - Admin Dashboard
      operationId: adminLogin
      summary: Admin login
      description: |
        Returns an admin token valid for 7 days. Unknown usernames and wrong passwords get the
        same answer in the same time.

        **Rate limit:** only failed attempts count, in fixed 15-minute windows. After 5 failures
        for one username from one client IP, that username is refused from that IP; after 20
        failures from one client IP across all usernames, that IP is refused. Both answer 429
        with `Retry-After` (seconds) until their window ends, even for the right password. The
        admin can still log in from any other IP, so attackers cannot lock the admin out. Behind
        a proxy the client IP comes from `X-Real-IP` or `X-Forwarded-For` only when the
        connection is from a trusted proxy (`TRUSTED_PROXY_CIDRS`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          description: The body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Invalid request
        '401':
          description: Unknown username or wrong password (the message is Arabic for "invalid login details").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: بيانات الدخول غير صحيحة
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyLoginAttempts'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/dashboard:
    get:
      tags:
        - Admin Dashboard
      operationId: getDashboard
      summary: Today's totals
      description: |
        Student, parent and attendance totals for today in Asia/Baghdad. When today is not a
        school day (`day_type` is `weekend`, `holiday` or `pause`), `present_today`,
        `excused_today` and `absent_today` are 0; `total_students` and `total_parents` keep
        their values.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: Today's totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/students:
    get:
      tags:
        - Admin Dashboard
      operationId: listStudents
      summary: List active students
      description: Every active student with the linked parent, newest (highest id) first.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: Active students.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentListResponse'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Admin Dashboard
      operationId: createStudent
      summary: Create a student
      description: |
        Creates the student and creates or updates the parent with `parent_phone` in one
        transaction: on any error nothing is written. A `parent_phone` that is not registered
        yet needs `parent_pin` (generated by the dashboard). Responds 200 (not 201) with the
        stored student; `parent_pin` is never returned.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreateRequest'
      responses:
        '200':
          description: Student created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCreatedResponse'
        '400':
          $ref: '#/components/responses/StudentWriteBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '409':
          $ref: '#/components/responses/RFIDTagTaken'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Admin Dashboard
      operationId: updateStudent
      summary: Update a student
      description: |
        Updates the student with `id` and creates or updates the parent with `parent_phone`, in
        one transaction: on any error, including 404, nothing is written. A `parent_phone` that
        is not registered yet needs `parent_pin`.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdateRequest'
      responses:
        '200':
          description: Student updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
