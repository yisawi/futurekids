  # ── ZKTeco ADMS ──────────────────────────────────────────────────────────────
  /iclock/cdata:
    get:
      tags: [ZKTeco Hardware]
      summary: Device registration / heartbeat (ADMS GET)
      description: |
        Called by ZKTeco devices on boot and periodically as a heartbeat.
        Always responds HTTP 200 with a plain-text ADMS handshake body.
        **No authentication — device firmware cannot carry tokens.**
      parameters:
        - name: SN
          in: query
          required: true
          schema:
            type: string
          description: Device serial number
          example: QJT3252301021
        - name: options
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: ADMS handshake acknowledged
          content:
            text/plain:
              schema:
                type: string
                example: "GET OPTION FROM: QJT3252301021\nATTLOG Stamp=9999\n"

    post:
      tags: [ZKTeco Hardware]
      summary: Device pushes ATTLOG attendance data (ADMS POST)
      description: |
        The primary attendance ingestion endpoint. The device POSTs raw ATTLOG records.

        **ATTLOG line formats supported:**
        - Positional: `PIN\tDateTime\tVerified\tStatus`
        - Key=Value: `PIN=x\tDateTime=y\tVerified=1\tStatus=0`

        The server:
        1. Parses all valid lines
        2. Resolves the device User ID to an internal `students.id` via `rfid_tag`
        3. Inserts into `attendance_logs` with `ON CONFLICT DO NOTHING` (idempotent)
        4. Fires async FCM push + notification history per new unique punch

        **Always responds HTTP 200 `OK`** — any other response causes the device to retry indefinitely.
      parameters:
        - name: SN
          in: query
          required: true
          schema:
            type: string
          example: QJT3252301021
        - name: table
          in: query
          required: true
          schema:
            type: string
            enum: [ATTLOG, OPERLOG, USER, BLACKLIST]
          example: ATTLOG
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              example: "1001\t2026-09-21 07:32:11\t1\t1\n1002\t2026-09-21 07:34:55\t1\t1\n"
      responses:
        '200':
          description: Data acknowledged — device will clear its buffer
          content:
            text/plain:
              schema:
                type: string
                example: "OK"

  /iclock/getrequest:
    get:
      tags: [ZKTeco Hardware]
      summary: Device polls for pending server commands (ADMS command queue)
      description: |
        Called periodically by the device to check for queued commands
        (e.g., enroll user, delete user, sync time).
        Currently returns an empty command queue.
        **Always responds HTTP 200.**
      parameters:
        - name: SN
          in: query
          required: true
          schema:
            type: string
          example: QJT3252301021
      responses:
        '200':
          description: Command queue (empty = no pending commands)
          content:
            text/plain:
              schema:
                type: string
                example: ""

  /api/attendance/push:
    post:
      tags: [ZKTeco Hardware]
      summary: Device pushes ATTLOG attendance data (Alias for /iclock/cdata)
      description: |
        An alternative endpoint to /iclock/cdata POST. It wraps the same ADMS protocol handler but includes DeviceAuthMiddleware logging.
      parameters:
        - name: SN
          in: query
          required: true
          schema:
            type: string
          example: QJT3252301021
        - name: table
          in: query
          required: true
          schema:
            type: string
            enum: [ATTLOG, OPERLOG, USER, BLACKLIST]
          example: ATTLOG
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              example: "1001\t2026-09-21 07:32:11\t1\t1\n1002\t2026-09-21 07:34:55\t1\t1\n"
      responses:
        '200':
          description: Data acknowledged
          content:
            text/plain:
              schema:
                type: string
                example: "OK"
        '401':
          description: Unauthorized device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Disabled device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/attendance/push/json:
    post:
      tags: [ZKTeco Hardware]
      summary: Hardware JSON Push Endpoint
      description: |
        Alternative attendance push endpoint that accepts JSON. Useful for modern readers or custom hardware that doesn't use ADMS.
      parameters:
        - name: SN
          in: query
          required: true
          schema:
            type: string
          description: Device serial number (used for middleware authentication)
          example: QJT3252301021
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardwarePushPayload'
      responses:
        '200':
          description: Punched successfully (or duplicate ignored)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Punched successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Unauthorized device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Disabled device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
