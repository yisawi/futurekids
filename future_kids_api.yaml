      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingPayload'
      responses:
        '200':
          description: Setting saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Setting saved
        '400':
          description: Malformed JSON, an empty `key`, or a `key` longer than 100 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Invalid payload
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/schedule:
    get:
      tags: [Admin Dashboard]
      operationId: getAdminSchedule
      summary: One class's weekly schedule
      description: |
        The schedule of the class `grade` + `section`, Sunday to Thursday, then by
        `period_number`. A class with no schedule returns 200 with an empty `data`. Take the
        available grade and section values from `GET /api/admin/students`; there is no class list.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/ScheduleGrade'
        - $ref: '#/components/parameters/ScheduleSection'
      responses:
        '200':
          description: The class's schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminScheduleResponse'
        '400':
          $ref: '#/components/responses/ScheduleBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Admin Dashboard]
      operationId: replaceAdminSchedule
      summary: Replace one class's weekly schedule
      description: |
        Replaces the whole schedule of one class in a single transaction: every stored period of
        that class is removed and `periods` is stored instead. **An empty `periods` array clears
        the class.** Other classes are never changed. A request that fails (400 or 500) changes
        nothing. Saves of schedules run one at a time, so two saves for the same class at once
        leave exactly one of them. The response is the saved schedule, as `GET` returns it.
        Parents see it in `GET /api/mobile/schedule` for every active child whose `grade` and
        `section` are equal to the saved ones.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminScheduleRequest'
      responses:
        '200':
          description: Saved; the class's schedule as now stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminScheduleResponse'
        '400':
          $ref: '#/components/responses/ScheduleBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/banners:
    get:
      tags: [Admin Dashboard]
      operationId: listAdminBanners
      summary: All banners
      description: Every banner, active or not, newest first, with its picture's metadata but never its bytes.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: Banners.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerListResponse'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Admin Dashboard]
      operationId: createBanner
      summary: Upload a new banner
      description: |
        Creates a banner and stores its picture, in one transaction: a request that fails
        creates nothing. Parents see it in `GET /api/mobile/banners` while it is active.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BannerCreateRequest'
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Created; the banner as now stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerResponse'
        '400':
          $ref: '#/components/responses/BannerWriteBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '413':
          $ref: '#/components/responses/BannerTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Admin Dashboard]
      operationId: updateBanner
      summary: Change a banner
      description: |
        Changes only the parts sent; omitted parts keep their value. An `image` part replaces the
        picture (and its ETag). One transaction: a request that fails changes nothing.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/BannerIdQuery'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BannerUpdateRequest'
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Updated; the banner as now stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerResponse'
        '400':
          $ref: '#/components/responses/BannerWriteBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/BannerNotFound'
        '413':
          $ref: '#/components/responses/BannerTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Admin Dashboard]
      operationId: deleteBanner
      summary: Delete a banner and its picture
      description: Permanent. To hide a banner but keep it, send `is_active=false` with `PUT` instead.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/BannerIdQuery'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Banner deleted
        '400':
          $ref: '#/components/responses/BannerIdBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/BannerNotFound'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/banners/image:
    get:
      tags: [Admin Dashboard]
      operationId: getAdminBannerImage
      summary: Preview a banner's picture
      description: |
        The uploaded picture of any banner, active or not, exactly as uploaded. Needs the admin
        token (send the `Authorization` header with the image request). Banners without an
        uploaded picture return 404; their picture is at their stored `image_url`.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/BannerIdQuery'
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a copy you already have; 304 when it is still current.
          schema:
            type: string
          example: '"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"'
      responses:
        '200':
          description: The picture.
          headers:
            ETag:
              $ref: '#/components/headers/BannerETag'
            Cache-Control:
              $ref: '#/components/headers/AdminImageCacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified; the copy whose `ETag` was sent in `If-None-Match` is current. No body.
          headers:
            ETag:
              $ref: '#/components/headers/BannerETag'
            Cache-Control:
              $ref: '#/components/headers/AdminImageCacheControl'
        '400':
          $ref: '#/components/responses/BannerIdBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: No banner with this id has an uploaded picture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Banner image not found
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/devices:
    get:
      tags: [Admin Dashboard]
      operationId: listDevices
      summary: All registered devices
      description: Every device, active or not, ordered by `location_name`.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: Devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Admin Dashboard]
      operationId: createDevice
      summary: Register a device
      description: A device registered without `is_active` is active.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
      responses:
        '200':
          description: Device registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Device added successfully
        '400':
          description: Malformed JSON, a missing `serial_number`, or a field longer than its `maxLength`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  summary: serial_number missing
                  value:
                    status: error
                    message: Invalid payload or missing SN
                tooLong:
                  summary: A field longer than its limit
                  value:
                    status: error
                    message: location_name must be at most 50 characters
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '409':
          description: A device with this serial number already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Device SN already exists
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Admin Dashboard]
      operationId: updateDevice
      summary: Update a device's location or active flag
      description: |
        Changes only the fields sent; an omitted `location_name` or `is_active` keeps its stored
        value. Send at least one of them.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
      responses:
        '200':
          description: Device updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Device updated successfully
        '400':
          description: Malformed JSON, a missing `serial_number`, neither `location_name` nor `is_active` sent, or a field longer than its `maxLength`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                nothingToChange:
                  summary: Neither field sent
                  value:
                    status: error
                    message: location_name or is_active is required
                missing:
                  summary: serial_number missing
                  value:
                    status: error
                    message: Invalid payload
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: No device has this serial number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Device not found
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Admin Dashboard]
      operationId: disableDevice
      summary: Disable a device
      description: |
        Sets `is_active = false`; the device and its attendance history are kept. Answers 200
        even when no device has this serial number.
      security:
        - AdminJWT: []
      parameters:
        - $ref: '#/components/parameters/DeviceSnQuery'
      responses:
        '200':
          description: Device disabled (or no such device).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                status: success
                message: Device disabled logically
        '400':
          description: '`sn` missing or empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Missing device SN
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Hardware (internal) ─────────────────────────────────────────────────────
  /iclock/cdata:
    get:
      tags: [Hardware (internal)]
      x-internal: true
      operationId: admsHandshake
      summary: Device registration and heartbeat (ADMS)
      description: |
        Called by a ZKTeco device on boot and as a heartbeat. No authentication and no database
        access: the server logs the call and answers plain-text `OK` (RULES.md §5).
      security: []
      parameters:
        - $ref: '#/components/parameters/AdmsSerial'
        - $ref: '#/components/parameters/AdmsOptions'
      responses:
        '200':
          $ref: '#/components/responses/AdmsOK'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'

    post:
      tags: [Hardware (internal)]
      x-internal: true
      operationId: admsPushRecords
      summary: Device pushes attendance records (ADMS)
      description: |
        The main attendance ingestion endpoint. Each line of an `ATTLOG` body is one punch:
        positional `PIN<TAB>YYYY-MM-DD HH:MM:SS<TAB>...` or `PIN=...<TAB>DateTime=...`.
        `PIN` is the student's `rfid_tag`; the time is Asia/Baghdad.

        The server stores the batch in one transaction, skipping (and logging) malformed
        lines, unknown PINs and records the database rejects; duplicates are ignored. After
        the commit it sends the check-in or check-out notification for each punch that is the
        first of its window. A device that is not registered, or is disabled, is also answered
        `OK` but nothing is stored.

        The answer is always plain-text `OK`, except when the database is temporarily
        unavailable: then the whole batch is rolled back and the answer is 503, so the device
        resends it (RULES.md §5). Bodies over 10 MiB are dropped and answered `OK`.
      security:
        - DeviceSerial: []
      parameters:
        - $ref: '#/components/parameters/AdmsTable'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
            example: "1001\t2026-09-21 07:32:11\t1\t1\n1002\t2026-09-21 07:34:55\t1\t1\n"
      responses:
        '200':
          $ref: '#/components/responses/AdmsOK'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '503':
          $ref: '#/components/responses/AdmsRetry'

  /iclock/getrequest:
    get:
      tags: [Hardware (internal)]
      x-internal: true
      operationId: admsPollCommands
      summary: Device polls for server commands (ADMS)
      description: No command queue exists yet, so the answer is always plain-text `OK` (no pending command).
      security: []
      parameters:
        - $ref: '#/components/parameters/AdmsSerial'
      responses:
        '200':
          $ref: '#/components/responses/AdmsOK'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'

  /api/attendance/push:
    post:
      tags: [Hardware (internal)]
      x-internal: true
      operationId: admsPushRecordsAlias
      summary: Device pushes attendance records (alias of POST /iclock/cdata)
      description: |
        Served by the same handler as `POST /iclock/cdata`, with the same behaviour and
        answers. Any other method on this path is also answered plain-text `OK` and ignored.
      security:
        - DeviceSerial: []
      parameters:
        - $ref: '#/components/parameters/AdmsTable'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
            example: "1001\t2026-09-21 07:32:11\t1\t1\n"
      responses:
        '200':
          $ref: '#/components/responses/AdmsOK'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '503':
          $ref: '#/components/responses/AdmsRetry'

  /api/attendance/push/json:
    post:
      tags: [Hardware (internal)]
      x-internal: true
      operationId: pushAttendanceJson
      summary: Device pushes one punch as JSON
      description: |
        For readers that do not speak ADMS. The device is authenticated by `SN` (registered and
        active); the punch is stored under that serial number. No notification is sent for
        punches received here.
      security:
        - DeviceSerial: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardwarePushPayload'
      responses:
        '200':
          description: Stored, or ignored as a duplicate or unknown `rfid_tag`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwarePushResponse'
        '400':
          description: Malformed JSON, `device_sn` or `rfid_tag` missing, or `push_time` not `YYYY-MM-DD HH:MM:SS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: push_time must be formatted as YYYY-MM-DD HH:MM:SS
        '401':
          description: '`SN` missing or not a registered device.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  summary: No SN parameter
                  value:
                    status: error
                    message: Device SN is required
                unknown:
                  summary: SN is not registered
                  value:
                    status: error
                    message: Unauthorized Device
        '403':
          description: The device is disabled, or the body's `device_sn` differs from `SN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                disabled:
                  summary: Disabled device
                  value:
                    status: error
                    message: Device is disabled
                mismatch:
                  summary: device_sn differs from SN
                  value:
                    status: error
                    message: device_sn does not match the authenticated device
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '431':
          $ref: '#/components/responses/HeaderTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The database is temporarily unavailable; nothing was stored. Resend the punch later.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Service temporarily unavailable, retry later
